<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Series</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
  background:#0f1115;
  color:#fff;
  font-family:system-ui,-apple-system,BlinkMacSystemFont;
}

.hero{
  position:relative;
  height:45vh;
  border-radius:18px;
  overflow:hidden;
  margin:20px;
}
.hero-bg{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center;
  filter:blur(2px) brightness(.55);
  transform:scale(1.15);
}
.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom,rgba(0,0,0,.25),rgba(0,0,0,.95));
}
.hero-content{
  position:relative;
  z-index:2;
  padding:30px;
  max-width:760px;
}
.hero-poster{
  width:160px;
  border-radius:14px;
  box-shadow:0 25px 50px rgba(0,0,0,.7);
}

.seasons{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:10px 20px;
}
.season{
  background:#1a1d24;
  padding:8px 18px;
  border-radius:20px;
  cursor:pointer;
  white-space:nowrap;
}
.season.active{
  background:#fff;
  color:#000;
}

.episodes{
  padding:20px;
  display:grid;
  gap:16px;
}
.episode{
  background:#151821;
  border-radius:14px;
  padding:12px;
  cursor:pointer;
  display:flex;
  gap:14px;
}
.ep-thumb{
  width:140px;
  height:80px;
  object-fit:cover;
  border-radius:10px;
}
.ep-title{font-weight:600}
.ep-desc{font-size:13px;color:#aaa}

video{
  width:calc(100% - 40px);
  margin:20px;
  border-radius:14px;
}
</style>
</head>

<body>

<a href="index.html" class="btn btn-light m-3">⬅ Back</a>

<div id="app"></div>
<video id="player" controls playsinline></video>

<script>
const TMDB_KEY="532a88c1ce983a87d6b28e49ad40a68e";
const TMDB="https://api.themoviedb.org/3";
const IMG="https://image.tmdb.org/t/p/original";

const params=new URLSearchParams(location.search);
const id=parseInt(params.get("id"));

const app=document.getElementById("app");
const player=document.getElementById("player");

let SERIES=null;
let SERIES_META=null;

/* ===== INIT ===== */
(async()=>{
  const list=await (await fetch("series.json")).json();
  SERIES=list.find(s=>s.id===id);
  if(!SERIES){app.innerHTML="<h3>Series not found</h3>";return;}

  SERIES_META=await (await fetch(`${TMDB}/tv/${SERIES.tmdbid}?api_key=${TMDB_KEY}`)).json();

  renderHero();
  renderSeasons();
  loadSeason(SERIES.seasons[0].season);
  resumePlayback();
})();

/* ===== HERO ===== */
function renderHero(){
  app.innerHTML=`
    <div class="hero">
      <div class="hero-bg" style="background-image:url('${IMG+SERIES_META.backdrop_path}')"></div>
      <div class="hero-content">
        <img src="${IMG+SERIES_META.poster_path}" class="hero-poster mb-3">
        <h2>${SERIES_META.name}</h2>
        <p class="text-muted">${SERIES_META.overview}</p>
      </div>
    </div>
    <div class="seasons" id="seasons"></div>
    <div class="episodes" id="episodes"></div>
  `;
}

/* ===== SEASONS ===== */
function renderSeasons(){
  document.getElementById("seasons").innerHTML=
    SERIES.seasons.map((s,i)=>`
      <div class="season ${i===0?'active':''}"
        onclick="loadSeason(${s.season},this)">
        Season ${s.season}
      </div>
    `).join("");
}

/* ===== EPISODES ===== */
async function loadSeason(num,el){
  document.querySelectorAll(".season").forEach(s=>s.classList.remove("active"));
  if(el) el.classList.add("active");

  const seasonData=SERIES.seasons.find(s=>s.season===num);
  const tmdbSeason=await (await fetch(`${TMDB}/tv/${SERIES.tmdbid}/season/${num}?api_key=${TMDB_KEY}`)).json();

  document.getElementById("episodes").innerHTML=
    tmdbSeason.episodes.map((ep,i)=>{
      const url=seasonData.videos[i];
      if(!url) return "";
      return `
      <div class="episode" onclick="play('${url}',${num},${i})">
        <img class="ep-thumb" src="${ep.still_path?IMG+ep.still_path:IMG+SERIES_META.poster_path}">
        <div>
          <div class="ep-title">EP ${ep.episode_number} · ${ep.name}</div>
          <div class="ep-desc">${ep.overview||""}</div>
        </div>
      </div>`;
    }).join("");
}

/* ===== PLAYER + RESUME ===== */
function play(url,season,index){
  player.src=url;
  player.play();

  player.ontimeupdate=()=>{
    localStorage.setItem(`series_resume_${SERIES.id}`,JSON.stringify({
      season,index,time:player.currentTime
    }));
  };
  player.scrollIntoView({behavior:"smooth"});
}

function resumePlayback(){
  const saved=localStorage.getItem(`series_resume_${SERIES.id}`);
  if(!saved) return;

  const p=JSON.parse(saved);
  loadSeason(p.season);
  setTimeout(()=>{
    play(SERIES.seasons.find(s=>s.season===p.season).videos[p.index],p.season,p.index);
    player.currentTime=p.time;
  },800);
}
</script>

</body>
</html>
