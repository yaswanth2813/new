<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Series</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
  background:#0f1115;
  color:#fff;
  font-family:system-ui,-apple-system,BlinkMacSystemFont;
}

/* HERO */
.hero{
  position:relative;
  height:45vh;
  border-radius:18px;
  overflow:hidden;
  margin:20px;
}
.hero-bg{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center;
  filter:blur(2px) brightness(.55);
  transform:scale(1.15);
}
.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom,rgba(0,0,0,.25),rgba(0,0,0,.95));
}
.hero-content{
  position:relative;
  z-index:2;
  padding:30px;
  max-width:760px;
}
.hero-poster{
  width:160px;
  border-radius:14px;
  box-shadow:0 25px 50px rgba(0,0,0,.7);
}

/* SEASONS */
.seasons{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:10px 20px;
}
.season{
  background:#1a1d24;
  padding:8px 18px;
  border-radius:20px;
  cursor:pointer;
  white-space:nowrap;
}
.season.active{
  background:#fff;
  color:#000;
}

/* EPISODES */
.episodes{
  padding:20px;
  display:grid;
  gap:16px;
}
.episode{
  background:#151821;
  border-radius:14px;
  padding:12px;
  cursor:pointer;
  display:flex;
  gap:14px;
}
.episode:hover{background:#1f2330}
.ep-thumb{
  width:140px;
  height:80px;
  object-fit:cover;
  border-radius:10px;
}
.ep-title{font-weight:600}
.ep-desc{font-size:13px;color:#aaa}

/* PLAYER */
video{
  width:calc(100% - 40px);
  margin:20px;
  border-radius:14px;
  display:none;
}

.back-btn{
  margin:20px;
  display:inline-block;
  padding:8px 20px;
  border-radius:20px;
  background:#fff;
  color:#000;
  text-decoration:none;
}
</style>
</head>

<body>

<a href="index.html" class="back-btn">⬅ Back</a>

<div id="app"></div>
<video id="player" controls></video>

<script>
/* ===== CONFIG ===== */
const TMDB_KEY = "532a88c1ce983a87d6b28e49ad40a68e";
const TMDB = "https://api.themoviedb.org/3";
const IMG  = "https://image.tmdb.org/t/p/original";
const SERIES_JSON = "series.json";

/* ===== PARAMS ===== */
const params = new URLSearchParams(location.search);
const id = parseInt(params.get("id"));
const resumeFlag = params.get("resume")==="1";

/* ===== ELEMENTS ===== */
const app = document.getElementById("app");
const player = document.getElementById("player");

let SERIES = null;

/* ===== INIT ===== */
(async()=>{
  const list = await (await fetch(SERIES_JSON)).json();
  const item = list.find(s => Number(s.id) === id);


  if(!item || !item.tmdbid){
    app.innerHTML="<h3 class='m-4'>Series not found</h3>";
    return;
  }

  const res = await fetch(`${TMDB}/tv/${item.tmdbid}?api_key=${TMDB_KEY}`);
  SERIES = await res.json();

  renderHero();
  renderSeasons();
  loadSeason(SERIES.seasons[0].season_number);

  handleResume();
})();

/* ===== HERO ===== */
function renderHero(){
  app.innerHTML = `
    <div class="hero">
      <div class="hero-bg" style="background-image:url('${IMG+SERIES.backdrop_path}')"></div>
      <div class="hero-content">
        <img src="${IMG+SERIES.poster_path}" class="hero-poster mb-3">
        <h2>${SERIES.name}</h2>
        <p class="text-muted">${SERIES.overview}</p>
      </div>
    </div>
    <div class="seasons" id="seasons"></div>
    <div class="episodes" id="episodes"></div>
  `;
}

/* ===== SEASONS ===== */
function renderSeasons(){
  document.getElementById("seasons").innerHTML =
    SERIES.seasons.map((s,i)=>`
      <div class="season ${i===0?'active':''}"
        onclick="loadSeason(${s.season_number},this)">
        Season ${s.season_number}
      </div>
    `).join("");
}

/* ===== EPISODES ===== */
async function loadSeason(num,el){
  document.querySelectorAll(".season").forEach(s=>s.classList.remove("active"));
  if(el) el.classList.add("active");

  const res = await fetch(`${TMDB}/tv/${SERIES.id}/season/${num}?api_key=${TMDB_KEY}`);
  const data = await res.json();

  document.getElementById("episodes").innerHTML =
    data.episodes.map(e=>`
      <div class="episode" onclick="playEpisode(${num},${e.episode_number})">
        <img class="ep-thumb"
          src="${e.still_path ? IMG+e.still_path : IMG+SERIES.poster_path}">
        <div>
          <div class="ep-title">EP ${e.episode_number} · ${e.name}</div>
          <div class="ep-desc">${e.overview || "No description"}</div>
        </div>
      </div>
    `).join("");
}

/* ===== PLAYER + RESUME ===== */
function playEpisode(season,episode){
  const url = getStreamUrl(season,episode);
  player.style.display="block";
  player.src=url;
  player.play();

  const key = `series_progress_${SERIES.id}`;
  player.ontimeupdate = ()=>{
    localStorage.setItem(key, JSON.stringify({
      season,
      episode,
      time: player.currentTime
    }));
  };

  player.scrollIntoView({behavior:"smooth"});
}

function handleResume(){
  if(!resumeFlag) return;

  const saved = localStorage.getItem(`series_progress_${SERIES.id}`);
  if(!saved) return;

  const p = JSON.parse(saved);
  loadSeason(p.season);
  setTimeout(()=>{
    player.style.display="block";
    player.src = getStreamUrl(p.season,p.episode);
    player.currentTime = p.time || 0;
    player.play();
  },800);
}

/* ===== STREAM MAP ===== */
function getStreamUrl(season,episode){
  return `https://yourcdn.com/${SERIES.id}/S${season}E${episode}.m3u8`;
}
</script>

</body>
</html>
