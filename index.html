<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yash OTT</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

<style>
body{
  background:#0f1115;
  color:#fff;
  font-family: system-ui, -apple-system, BlinkMacSystemFont;
}

/* ================= HERO ================= */
.hero{
  position:relative;
  height:60vh;
  border-radius:18px;
  overflow:hidden;
  margin:20px;
}

.hero-bg{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center;
  filter:blur(4px) brightness(.75);
  transform:scale(1.2);
  z-index:0;
}

/* 🎨 Dynamic glow */
.hero::before{
  content:"";
  position:absolute;
  inset:-20%;
  background:radial-gradient(
    circle at center,
    var(--hero-glow, rgba(0,0,0,.4)) 0%,
    rgba(0,0,0,0) 70%
  );
  z-index:0;
}

/* 🎬 Hero video */
#hero-video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
  transition:opacity .6s ease;
  z-index:1;
}

.hero.video-active #hero-video{
  opacity:1;
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom,rgba(0,0,0,.2),rgba(0,0,0,.95));
  z-index:2;
}

.hero-content{
  position:relative;
  z-index:3;
  padding:40px;
  max-width:600px;
}

/* ================= SEARCH ================= */
.search-wrap{
  position:relative;
  max-width:500px;
  margin:0 20px 30px;
}

.search-suggest{
  position:absolute;
  top:100%;
  left:0;
  right:0;
  background:#1a1d24;
  border-radius:10px;
  max-height:300px;
  overflow-y:auto;
  display:none;
  z-index:50;
}

.search-suggest div{
  padding:10px;
  cursor:pointer;
  border-bottom:1px solid #2a2e38;
}

.search-suggest div:hover{
  background:#2a2e38;
}

/* ================= ROWS ================= */
.row-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:20px 20px 10px;
}

.view-all{
  font-size:14px;
  color:#bbb;
  cursor:pointer;
}

.view-all:hover{
  color:#fff;
  text-decoration:underline;
}

.ott-row{
  display:flex;
  gap:14px;
  overflow-x:auto;
  padding:0 20px 10px;
  scroll-behavior:smooth;
}

.ott-row::-webkit-scrollbar{
  height:6px;
}
.ott-row::-webkit-scrollbar-thumb{
  background:#333;
  border-radius:10px;
}

/* ================= CARD + VIDEO HOVER ================= */
.preview-card{
  position:relative;
  min-width:160px;
  cursor:pointer;
}

.preview-card img,
.preview-card video{
  width:100%;
  height:240px;
  object-fit:cover;
  border-radius:14px;
}

.preview-card video{
  position:absolute;
  inset:0;
  opacity:0;
  pointer-events:none;
  transition:opacity .3s ease;
}

.preview-card:hover video{ opacity:1; }
.preview-card:hover img{ opacity:0; }

.ott-title{
  font-size:14px;
  text-align:center;
  margin-top:6px;
  color:#ccc;
}

/* ================= VIEW ALL GRID ================= */
.view-all-grid{
  display:grid;
  gap:18px;
  padding:20px;
}

@media (max-width:575px){
  .view-all-grid{ grid-template-columns:repeat(2,1fr); }
}
@media (min-width:576px){
  .view-all-grid{ grid-template-columns:repeat(3,1fr); }
}

/* ================= MISC ================= */
.fade-in{
  opacity:0;
  animation:fade .6s ease forwards;
}
@keyframes fade{ to{opacity:1} }

footer{
  text-align:center;
  color:#777;
  margin:30px 0;
}
</style>
</head>

<body>

<div class="container-fluid">

  <!-- HERO -->
  <div class="hero fade-in">
    <div class="hero-bg" id="hero-bg"></div>
    <video id="hero-video" muted loop playsinline></video>

    <div class="hero-content">
      <h1 id="hero-title">Loading…</h1>
      <p class="text-muted">Watch movies OTT style</p>
      <a id="hero-link" class="btn btn-light">Watch Now</a>
    </div>
  </div>

  <!-- SEARCH -->
  <div class="search-wrap">
    <input id="searchInput" class="form-control" placeholder="Search movies…">
    <div class="search-suggest" id="suggestBox"></div>
  </div>

  <!-- ROWS -->
  <div id="rows"></div>

</div>

<footer>Data provided by YASH</footer>

<script>
const TMDB_API_KEY = "532a88c1ce983a87d6b28e49ad40a68e";
const TMDB_BASE = "https://api.themoviedb.org/3";
const IMG_BASE = "https://image.tmdb.org/t/p/w500";

const CACHE_TTL = 24 * 60 * 60 * 1000;
const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

let allPosts = [];

/* ========== CACHE ========== */
function getCache(k){
  try{
    const r = localStorage.getItem(k);
    if(!r) return null;
    const o = JSON.parse(r);
    if(Date.now() - o.time > CACHE_TTL){
      localStorage.removeItem(k);
      return null;
    }
    return o.data;
  }catch{ return null }
}
function setCache(k,d){
  try{
    localStorage.setItem(k, JSON.stringify({ time: Date.now(), data: d }));
  }catch{}
}

/* ========== TMDB → YOUR FORMAT ========== */
function mapMovie(m){
  return {
    id: m.id,
    heading: m.title || m.name,
    poster: m.poster_path ? IMG_BASE + m.poster_path : "",
    language:
      m.original_language === "te" ? "Telugu" :
      m.original_language === "hi" ? "Hindi" :
      "English",
    videoUrl: "" // trailers handled later if you want
  };
}

/* ========== LOAD FROM TMDB ========== */
async function loadPosts(){
  const cacheKey = "tmdb_cache";
  const cached = getCache(cacheKey);
  if(cached) return cached;

  const urls = [
    `${TMDB_BASE}/trending/movie/week?api_key=${TMDB_API_KEY}`,
    `${TMDB_BASE}/discover/movie?api_key=${TMDB_API_KEY}&with_original_language=te`,
    `${TMDB_BASE}/discover/movie?api_key=${TMDB_API_KEY}&with_original_language=hi`
  ];

  try{
    const results = [];
    for(const u of urls){
      const r = await fetch(u);
      const j = await r.json();
      if(j.results) results.push(...j.results);
    }

    const mapped = results
      .filter(m => m.poster_path)
      .map(mapMovie);

    setCache(cacheKey, mapped);
    return mapped;
  }catch{
    return cached || [];
  }
}

/* ========== HERO GLOW ========== */
function applyHeroGlow(imgUrl){
  const img = new Image();
  img.crossOrigin = "anonymous";
  img.src = imgUrl;
  img.onload = () => {
    const c = document.createElement("canvas");
    const x = c.getContext("2d");
    c.width = c.height = 10;
    x.drawImage(img,0,0,10,10);
    const d = x.getImageData(0,0,10,10).data;
    let r=0,g=0,b=0,n=0;
    for(let i=0;i<d.length;i+=4){
      r+=d[i]; g+=d[i+1]; b+=d[i+2]; n++;
    }
    document.documentElement.style.setProperty(
      "--hero-glow",
      `rgba(${r/n|0},${g/n|0},${b/n|0},0.45)`
    );
  };
}

/* ========== CARD ========== */
function cardHTML(p){
  return `
    <div class="preview-card"
      onclick="location.href='post.html?id=${p.id}'"
      ${!isTouchDevice ? `
      onmouseenter="let v=this.querySelector('video');if(v){v.play();}"
      onmouseleave="let v=this.querySelector('video');if(v){v.pause();}"` : ""}
    >
      <img src="${p.poster}" onerror="this.src='https://via.placeholder.com/300x450'">
      <div class="ott-title">${p.heading}</div>
    </div>
  `;
}

/* ========== VIEW ALL ========== */
function showViewAll(title,list){
  rows.innerHTML = `
    <div class="row-header">
      <h4>${title}</h4>
      <span class="view-all" onclick="renderHome()">⬅ Back</span>
    </div>
    <div class="view-all-grid">
      ${list.map(cardHTML).join("")}
    </div>
  `;
}

/* ========== ROW ========== */
function renderRow(title,list,key){
  if(!list.length) return "";
  return `
    <div class="row-header">
      <h4>${title}</h4>
      <span class="view-all" onclick="showViewAll('${title}',rowData['${key}'])">
        View All
      </span>
    </div>
    <div class="ott-row">
      ${list.slice(0,15).map(cardHTML).join("")}
    </div>
  `;
}

/* ========== SEARCH ========== */
searchInput.oninput = function(){
  const q = this.value.toLowerCase();
  if(!q){ suggestBox.style.display="none"; return; }

  const m = allPosts
    .filter(p => p.heading.toLowerCase().includes(q))
    .slice(0,8);

  if(!m.length){ suggestBox.style.display="none"; return; }

  suggestBox.innerHTML = m.map(p =>
    `<div onclick="location.href='post.html?id=${p.id}'">${p.heading}</div>`
  ).join("");

  suggestBox.style.display="block";
};

/* ========== HOME ========== */
function renderHome(){
  window.rowData = {
    latest: allPosts,
    telugu: allPosts.filter(p => p.language==="Telugu"),
    hindi: allPosts.filter(p => p.language==="Hindi"),
    english: allPosts.filter(p => p.language==="English")
  };

  rows.innerHTML =
    renderRow("Latest Movies",rowData.latest,"latest") +
    renderRow("Telugu Movies",rowData.telugu,"telugu") +
    renderRow("Hindi Movies",rowData.hindi,"hindi") +
    renderRow("English Movies",rowData.english,"english");
}

/* ========== INIT ========== */
(async function(){
  allPosts = await loadPosts();
  if(!allPosts.length) return;

  const hero = allPosts[Math.floor(Math.random()*allPosts.length)];

  heroBg.style.backgroundImage = `url('${hero.poster}')`;
  applyHeroGlow(hero.poster);

  heroTitle.textContent = hero.heading;
  heroLink.href = `post.html?id=${hero.id}`;

  renderHome();
})();
</script>


</body>
</html>
