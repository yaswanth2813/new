<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yash - Movie Gallery</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <style>
    body { background-color: #f0f4f8; }

    .card {
      transition: transform .3s ease, box-shadow .3s ease;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-8px) scale(1.03);
      box-shadow: 0 12px 24px rgba(0,0,0,.15);
    }

    .poster-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .card-body {
      padding: 10px;
      flex-grow: 1;
    }

    footer {
      background: linear-gradient(to right, #4a90e2, #50e3c2);
      color: #fff;
      text-align: center;
      padding: 20px;
      margin-top: 50px;
    }

    .actor {
      width: 100px;
      height: auto;
    }

    .fade-in {
      opacity: 0;
      animation: fadeIn .6s ease forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }
  </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
  <div class="container">
    <a class="navbar-brand fs-4" href="#">Yash's Movie Collection</a>
  </div>
</nav>

<!-- ACTOR LINKS -->
<div class="d-flex p-2 gap-2">
  <a href="mb/mb.html"><img class="actor border border-2" src="https://imgs.search.brave.com/ZOoMF0zfd1xtDk_32J_kryiWl_vg9X0RU54B5nhJl5E/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9pLnBp/bmltZy5jb20vb3Jp/Z2luYWxzLzcwL2Iw/LzM5LzcwYjAzOTcx/OTE1NWFhNTFhMjE1/MjhjOGI2ZGE2NjRkLmpwZw"/></a>
  <a href="ka/ka.html"><img class="actor border border-2" src="https://images.filmibeat.com/img/popcorn/profile_photos/kiran-abbavaram-20200908103724-46359.jpg"/></a>
  <a href="pb/pb.html"><img class="actor border border-2" src="https://m.sakshipost.com/sites/default/files/styles/storypage_main/public/gallery_images/2025/10/22/Prabhas4-1729598340.jpg"/></a>
</div>

<!-- FILTER -->
<div class="container mt-3">
  <select class="form-select mb-3" id="languageSelect">
    <option value="All">All Languages</option>
    <option value="Live">Live</option>
    <option value="Telugu">Telugu</option>
    <option value="Hindi">Hindi</option>
    <option value="English">English</option>
    <option value="Requested">Requested</option>
  </select>

  <input type="text" id="searchInput" class="form-control mb-3" placeholder="Search by Movie..." />
</div>

<!-- POSTS -->
<div class="container-fluid py-4">
  <div class="row g-3 fade-in" id="posts-container"></div>
</div>

<footer>
  © 2025 My Movies. Data provided by YASH.
</footer>

<script>
/* =====================
   CONFIG + CACHE
===================== */
const POSTS_JSON_URL = "posts.json";
const CACHE_TTL = 24 * 60 * 60 * 1000;

const container = document.getElementById("posts-container");
const searchInput = document.getElementById("searchInput");
const languageSelect = document.getElementById("languageSelect");

let allPosts = [];
let selectedLanguage = "All";

/* =====================
   CACHE UTILS
===================== */
function getCache(key) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    if (Date.now() - obj.time > CACHE_TTL) {
      localStorage.removeItem(key);
      return null;
    }
    return obj.data;
  } catch { return null; }
}

function setCache(key, data) {
  try {
    localStorage.setItem(key, JSON.stringify({
      time: Date.now(),
      data
    }));
  } catch {}
}

/* =====================
   LOAD POSTS (JSON FIRST)
===================== */
async function loadPosts() {
  const cacheKey = "posts_cache";
  const cached = getCache(cacheKey);
  if (cached) return cached;

  try {
    const res = await fetch(POSTS_JSON_URL);
    const data = await res.json();
    const cleaned = data.filter(p => p.heading).map(p => ({
      ...p,
      id: parseInt(p.id)
    }));
    setCache(cacheKey, cleaned);
    return cleaned;
  } catch {
    return [];
  }
}

/* =====================
   CARD CREATION
===================== */
function createCard(post) {
  const col = document.createElement("div");
  col.className = "col-6 col-md-4 col-lg-2 d-flex";

  col.innerHTML = `
    <div class="card shadow-sm">
      <img src="${post.poster}" class="poster-img"
        onerror="this.src='https://via.placeholder.com/200x300?text=No+Image'">
      <div class="card-body">
        <h6 class="d-flex justify-content-between">
          <span>${post.heading}</span>
          <span class="badge bg-success">${post.language}</span>
        </h6>
      </div>
    </div>
  `;

  col.onclick = () => {
    window.location.href = `post.html?id=${post.id}`;
  };

  return col;
}

/* =====================
   FILTER + RENDER
===================== */
function filterAndRender() {
  const q = searchInput.value.toLowerCase();

  const filtered = allPosts.filter(p => {
    const matchText = p.heading.toLowerCase().includes(q);
    const matchLang = selectedLanguage === "All" || p.language === selectedLanguage;
    return matchText && matchLang;
  });

  filtered.sort((a, b) => b.id - a.id);

  container.innerHTML = "";
  if (!filtered.length) {
    container.innerHTML = "<p class='text-center text-muted'>No movies found.</p>";
    return;
  }

  filtered.forEach(p => container.appendChild(createCard(p)));
}

/* =====================
   INIT
===================== */
(async function init() {
  allPosts = await loadPosts();
  filterAndRender();
})();

searchInput.oninput = filterAndRender;
languageSelect.onchange = e => {
  selectedLanguage = e.target.value;
  filterAndRender();
};
</script>

</body>
</html>
