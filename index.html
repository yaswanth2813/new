<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yash OTT</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

<style>
body{
  background:#0f1115;
  color:#fff;
  font-family:system-ui,-apple-system,BlinkMacSystemFont;
}

/* ================= SKELETON ================= */
.skeleton{
  background:#1a1d24;
  border-radius:14px;
  position:relative;
  overflow:hidden;
}
.skeleton::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    110deg,
    rgba(255,255,255,0) 30%,
    rgba(255,255,255,.08) 45%,
    rgba(255,255,255,0) 60%
  );
  animation:shimmer 1.2s infinite;
}
@keyframes shimmer{
  from{transform:translateX(-100%)}
  to{transform:translateX(100%)}
}
.hero-skeleton{
  height:60vh;
  margin:20px;
  border-radius:18px;
}
.card-skeleton{
  min-width:160px;
  height:240px;
  flex:0 0 auto;
}

/* ================= HERO ================= */
.hero{
  display:none;
  position:relative;
  height:60vh;
  border-radius:18px;
  overflow:hidden;
  margin:20px;
}
.hero-bg{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:top;
  filter:blur(1px) brightness(.55);
  transform:scale(1.2);
}
#hero-video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
  transition:opacity .6s;
}
.hero.video-active #hero-video{opacity:1}
.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom,rgba(0,0,0,.2),rgba(0,0,0,.95));
}
.hero-content{
  position:relative;
  z-index:2;
  padding:40px;
  max-width:600px;
}

/* ================= ROWS / CAROUSEL ================= */
.row-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:20px 20px 10px;
}
.view-all{
  font-size:14px;
  color:#bbb;
  cursor:pointer;
}
.view-all:hover{color:#fff;text-decoration:underline}

.ott-row{
  display:flex;
  gap:14px;
  overflow-x:auto;
  padding:0 20px 10px;
  scroll-behavior:smooth;
}
.ott-row::-webkit-scrollbar{height:6px}
.ott-row::-webkit-scrollbar-thumb{
  background:#333;
  border-radius:10px;
}

/* ================= CARD ================= */
.preview-card{
  position:relative;
  min-width:160px;
  cursor:pointer;
}
.preview-card img,
.preview-card video{
  width:100%;
  height:240px;
  object-fit:cover;
  border-radius:14px;
}
.preview-card video{
  position:absolute;
  inset:0;
  opacity:0;
  pointer-events:none;
  transition:opacity .3s;
}
.preview-card:hover video{opacity:1}
.preview-card:hover img{opacity:0}

.ott-title{
  font-size:14px;
  text-align:center;
  margin-top:6px;
  color:#ccc;
}

/* ================= VIEW ALL GRID ================= */
.view-all-grid{
  display:grid;
  gap:18px;
  padding:20px;
}
@media(max-width:575px){.view-all-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:576px){.view-all-grid{grid-template-columns:repeat(3,1fr)}}



</style>
</head>

<body>

<div class="container-fluid">

<!-- HERO SKELETON -->
<div class="skeleton hero-skeleton" id="hero-skeleton"></div>

<!-- HERO -->
<div class="hero">
  <div class="hero-bg" id="hero-bg"></div>
  <video id="hero-video" muted loop playsinline preload="metadata"></video>
  <div class="hero-content">
    <h1 id="hero-title"></h1>
    <a id="hero-link" class="btn btn-light">Watch Now</a>
  </div>
</div>

<!-- ROWS -->
<div id="rows">
  <div class="row-header"><h4>Loading…</h4></div>
  <div class="ott-row">
    <div class="skeleton card-skeleton"></div>
    <div class="skeleton card-skeleton"></div>
    <div class="skeleton card-skeleton"></div>
    <div class="skeleton card-skeleton"></div>
  </div>
</div>

</div>

<script>
const POSTS_JSON_URL="posts.json";
const isTouch=('ontouchstart'in window)||navigator.maxTouchPoints>0;
const isLowEnd=navigator.hardwareConcurrency<=4||navigator.deviceMemory<=4;
let allPosts=[];
/* ===== TMDB CONFIG ===== */
const TMDB_API_KEY = "532a88c1ce983a87d6b28e49ad40a68e";
const TMDB_IMG = "https://image.tmdb.org/t/p/original";
const BACKDROP_TTL = 24 * 60 * 60 * 1000;

/* ===== TMDB CACHE ===== */
function getBackdropCache(key){
  try{
    const c = JSON.parse(localStorage.getItem(key));
    if(c && Date.now() - c.time < BACKDROP_TTL) return c.url;
  }catch{}
  return null;
}
function setBackdropCache(key, url){
  try{
    localStorage.setItem(key, JSON.stringify({ url, time: Date.now() }));
  }catch{}
}

/* ===== FETCH TMDB BACKDROP ===== */
async function fetchBackdrop(title){
  const key = "bd_" + title.toLowerCase();
  const cached = getBackdropCache(key);
  if(cached) return cached;

  try{
    const res = await fetch(
      `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(title)}`
    );
    const data = await res.json();
    const movie = data.results?.find(m => m.backdrop_path);
    if(movie){
      const url = TMDB_IMG + movie.backdrop_path;
      setBackdropCache(key, url);
      return url;
    }
  }catch(e){}
  return null;
}


/* ========== AUDIO FADE ========== */
function fadeInAudio(v){
  v.muted=false;v.volume=0;
  let vol=0;
  v._fade=setInterval(()=>{
    vol+=0.1;
    v.volume=Math.min(vol,0.6);
    if(vol>=0.6) clearInterval(v._fade);
  },80);
}

/* ========== AUTO PAUSE OFFSCREEN ========== */
const observer=new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(!e.isIntersecting){
      const v=e.target.querySelector("video");
      if(v){
        clearInterval(v._loopTimer);
        v.pause();
      }
    }
  });
},{threshold:.3});

/* ========== CARD HTML ========== */
function cardHTML(p){
return `
<div class="preview-card"
${isTouch?`
onclick="
  const v=this.querySelector('video');
  if(!v){location.href='post.html?id=${p.id}';return;}
  if(!v._playing){
    const play=()=>{
      v.currentTime=Math.random()*(v.duration-4);
      v.play();v._playing=true;
    };
    v.muted=true;
    if(v.readyState>=1) play();
    else v.onloadedmetadata=play;
  }else location.href='post.html?id=${p.id}';
"`:`
onmouseenter="
  if(${isLowEnd})return;
  const card=this,v=card.querySelector('video');
  card._hover=setTimeout(()=>{
    const play=()=>{
      const seg=3.5;
      const start=Math.random()*(v.duration-seg-1);
      v.currentTime=start;
      v.play();fadeInAudio(v);
      v._loopTimer=setInterval(()=>{
        if(v.currentTime>=start+seg)v.currentTime=start;
      },200);
    };
    if(v.readyState>=1) play();
    else v.onloadedmetadata=play;
  },300);
"
onmouseleave="
  clearTimeout(this._hover);
  const v=this.querySelector('video');
  if(v){
    clearInterval(v._loopTimer);
    clearInterval(v._fade);
    v.muted=true;v.volume=0;
    v.pause();
  }
"`}>
<img src="${p.poster}" class="skeleton"
onload="this.classList.remove('skeleton')">
${!isTouch && p.videoUrl?`
<video muted preload="none" playsinline>
  <source src="${p.videoUrl}" type="video/mp4">
</video>`:""}
<div class="ott-title">${p.heading}</div>
</div>`;
}

/* ========== ROWS ========== */
function renderRow(title,list,key){
  if(!list.length) return "";
  return `
  <div class="row-header">
    <h4>${title}</h4>
    <span class="view-all" onclick="showViewAll('${title}','${key}')">View All</span>
  </div>
  <div class="ott-row">
    ${list.slice(0,15).map(p=>cardHTML(p)).join("")}
  </div>`;
}

function showViewAll(title,key){
  const rows=document.getElementById("rows");
  rows.innerHTML=`
    <div class="row-header">
      <h4>${title}</h4>
      <span class="view-all" onclick="renderHome()">⬅ Back</span>
    </div>
    <div class="view-all-grid">
      ${rowData[key].map(p=>cardHTML(p)).join("")}
    </div>`;
  document.querySelectorAll(".preview-card").forEach(c=>observer.observe(c));
}

function renderHome(){
  window.rowData={
    latest:allPosts,
    telugu:allPosts.filter(p=>p.language==="Telugu"),
    hindi:allPosts.filter(p=>p.language==="Hindi"),
    english:allPosts.filter(p=>p.language==="English")
  };

  const rows=document.getElementById("rows");
  rows.innerHTML=
    renderRow("Latest Movies",rowData.latest,"latest")+
    renderRow("Telugu Movies",rowData.telugu,"telugu")+
    renderRow("Hindi Movies",rowData.hindi,"hindi")+
    renderRow("English Movies",rowData.english,"english");

  document.querySelectorAll(".preview-card").forEach(c=>observer.observe(c));
}

/* ========== INIT ========== */
(async()=>{
const res=await fetch(POSTS_JSON_URL);
allPosts=(await res.json()).filter(p=>p.heading);
allPosts.sort((a,b)=>b.id-a.id);

/* HERO */
const hero=allPosts[Math.floor(Math.random()*allPosts.length)];
const backdrop = await fetchBackdrop(hero.heading);
document.getElementById("hero-bg").style.backgroundImage =`url('${backdrop || hero.poster}')`;
document.getElementById("hero-title").textContent=hero.heading;
document.getElementById("hero-link").href=`post.html?id=${hero.id}`;

const heroVideo=document.getElementById("hero-video");
if(hero.videoUrl){
  heroVideo.src=hero.videoUrl;
  heroVideo.onloadedmetadata=()=>{
    const s=heroVideo.duration*.4;
    const e=heroVideo.duration*.6;
    heroVideo.currentTime=s+Math.random()*(e-s);
    heroVideo.play();
    document.querySelector(".hero").classList.add("video-active");
  };
}

/* SHOW HERO */
document.getElementById("hero-skeleton").remove();
document.querySelector(".hero").style.display="block";

/* HOME */
renderHome();
})();
</script>

</body>
</html>
