<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1"> <title>Yash OTT</title> <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/> <style> body{ background:#0f1115; color:#fff; font-family: system-ui, -apple-system, BlinkMacSystemFont; } /* ================= HERO ================= */ .hero{ position:relative; height:60vh; border-radius:18px; overflow:hidden; margin:20px; } .hero-bg{ position:absolute; inset:0; background-size:cover; background-position:center; filter:blur(4px) brightness(.75); transform:scale(1.2); z-index:0; } /* 🎨 Dynamic glow */ .hero::before{ content:""; position:absolute; inset:-20%; background:radial-gradient( circle at center, var(--hero-glow, rgba(0,0,0,.4)) 0%, rgba(0,0,0,0) 70% ); z-index:0; } /* 🎬 Hero video */ #hero-video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .6s ease; z-index:1; } .hero.video-active #hero-video{ opacity:1; } .hero::after{ content:""; position:absolute; inset:0; background:linear-gradient(to bottom,rgba(0,0,0,.2),rgba(0,0,0,.95)); z-index:2; } .hero-content{ position:relative; z-index:3; padding:40px; max-width:600px; } /* ================= SEARCH ================= */ .search-wrap{ position:relative; max-width:500px; margin:0 20px 30px; } .search-suggest{ position:absolute; top:100%; left:0; right:0; background:#1a1d24; border-radius:10px; max-height:300px; overflow-y:auto; display:none; z-index:50; } .search-suggest div{ padding:10px; cursor:pointer; border-bottom:1px solid #2a2e38; } .search-suggest div:hover{ background:#2a2e38; } /* ================= ROWS ================= */ .row-header{ display:flex; justify-content:space-between; align-items:center; margin:20px 20px 10px; } .view-all{ font-size:14px; color:#bbb; cursor:pointer; } .view-all:hover{ color:#fff; text-decoration:underline; } .ott-row{ display:flex; gap:14px; overflow-x:auto; padding:0 20px 10px; scroll-behavior:smooth; } .ott-row::-webkit-scrollbar{ height:6px; } .ott-row::-webkit-scrollbar-thumb{ background:#333; border-radius:10px; } /* ================= CARD + VIDEO HOVER ================= */ .preview-card{ position:relative; min-width:160px; cursor:pointer; } .preview-card img, .preview-card video{ width:100%; height:240px; object-fit:cover; border-radius:14px; } .preview-card video{ position:absolute; inset:0; opacity:0; pointer-events:none; transition:opacity .3s ease; } .preview-card:hover video{ opacity:1; } .preview-card:hover img{ opacity:0; } .ott-title{ font-size:14px; text-align:center; margin-top:6px; color:#ccc; } /* ================= VIEW ALL GRID ================= */ .view-all-grid{ display:grid; gap:18px; padding:20px; } @media (max-width:575px){ .view-all-grid{ grid-template-columns:repeat(2,1fr); } } @media (min-width:576px){ .view-all-grid{ grid-template-columns:repeat(3,1fr); } } /* ================= MISC ================= */ .fade-in{ opacity:0; animation:fade .6s ease forwards; } @keyframes fade{ to{opacity:1} } footer{ text-align:center; color:#777; margin:30px 0; } </style> </head> <body> <div class="container-fluid"> <!-- HERO --> <div class="hero fade-in"> <div class="hero-bg" id="hero-bg"></div> <video id="hero-video" muted loop playsinline></video> <div class="hero-content"> <h1 id="hero-title">Loading…</h1> <p class="text-muted">Watch movies OTT style</p> <a id="hero-link" class="btn btn-light">Watch Now</a> </div> </div> <!-- SEARCH --> <div class="search-wrap"> <input id="searchInput" class="form-control" placeholder="Search movies…"> <div class="search-suggest" id="suggestBox"></div> </div> <!-- ROWS --> <div id="rows"></div> </div> <footer>Data provided by YASH</footer> <script> const POSTS_JSON_URL="posts.json"; const CACHE_TTL=24*60*60*1000; const isTouchDevice=('ontouchstart' in window)||navigator.maxTouchPoints>0; let allPosts=[]; /* ========== CACHE ========== */ function getCache(k){ try{ const r=localStorage.getItem(k); if(!r) return null; const o=JSON.parse(r); if(Date.now()-o.time>CACHE_TTL){ localStorage.removeItem(k); return null; } return o.data; }catch{return null} } function setCache(k,d){ try{ localStorage.setItem(k,JSON.stringify({time:Date.now(),data:d})); }catch{} } /* ========== LOAD POSTS ========== */ async function loadPosts(){ const cacheKey = "posts_cache"; try { const res = await fetch(POSTS_JSON_URL, { cache: "no-store" }); const freshData = (await res.json()).filter(p => p.heading); // 🔥 Compare cache vs fresh length const cached = getCache(cacheKey); if (!cached || cached.length !== freshData.length) { setCache(cacheKey, freshData); return freshData; } return cached; } catch { return getCache(cacheKey) || []; } } /* ========== HERO COLOR GLOW ========== */ function applyHeroGlow(imgUrl){ const img=new Image(); img.crossOrigin="anonymous"; img.src=imgUrl; img.onload=()=>{ const c=document.createElement("canvas"); const x=c.getContext("2d"); c.width=c.height=10; x.drawImage(img,0,0,10,10); const d=x.getImageData(0,0,10,10).data; let r=0,g=0,b=0,n=0; for(let i=0;i<d.length;i+=4){ r+=d[i]; g+=d[i+1]; b+=d[i+2]; n++; } r=Math.floor(r/n); g=Math.floor(g/n); b=Math.floor(b/n); document.documentElement.style.setProperty( "--hero-glow",rgba(${r},${g},${b},0.45) ); }; } /* ========== CARD HTML ========== */ function cardHTML(p){ return <div class="preview-card" onclick="location.href='post.html?id=${p.id}'" ${!isTouchDevice? onmouseenter="let v=this.querySelector('video');if(v){v.currentTime=8;v.play();}" onmouseleave="let v=this.querySelector('video');if(v){v.pause();}":""} > <img src="${p.poster}" onerror="this.src='https://via.placeholder.com/300x450'"> ${!isTouchDevice && p.videoUrl? <video muted loop preload="metadata"> <source src="${p.videoUrl}" type="video/mp4"> </video>:""} <div class="ott-title">${p.heading}</div> </div> ; } /* ========== VIEW ALL ========== */ function showViewAll(title,list){ const rows=document.getElementById("rows"); rows.innerHTML= <div class="row-header"> <h4>${title}</h4> <span class="view-all" onclick="renderHome()">⬅ Back</span> </div> <div class="view-all-grid"> ${list.map(p=>cardHTML(p)).join("")} </div> ; } /* ========== ROW ========== */ function renderRow(title,list,key){ if(!list.length) return ""; return <div class="row-header"> <h4>${title}</h4> <span class="view-all" onclick="showViewAll('${title}',rowData['${key}'])"> View All </span> </div> <div class="ott-row"> ${list.slice(0,15).map(p=>cardHTML(p)).join("")} </div> ; } /* ========== SEARCH ========== */ const searchInput=document.getElementById("searchInput"); const suggestBox=document.getElementById("suggestBox"); searchInput.oninput=function(){ const q=this.value.toLowerCase(); if(!q){suggestBox.style.display="none";return;} const m=allPosts.filter(p=>p.heading.toLowerCase().includes(q)).slice(0,8); if(!m.length){suggestBox.style.display="none";return;} suggestBox.innerHTML=m.map(p=> <div onclick="location.href='post.html?id=${p.id}'">${p.heading}</div> ).join(""); suggestBox.style.display="block"; }; document.onclick=e=>{ if(!searchInput.contains(e.target)){ suggestBox.style.display="none"; } }; /* ========== HOME ========== */ function renderHome(){ window.rowData={ latest:allPosts, telugu:allPosts.filter(p=>p.language==="Telugu"), hindi:allPosts.filter(p=>p.language==="Hindi"), english:allPosts.filter(p=>p.language==="English") }; const rows=document.getElementById("rows"); rows.innerHTML= renderRow("Latest Movies",rowData.latest,"latest")+ renderRow("Telugu Movies",rowData.telugu,"telugu")+ renderRow("Hindi Movies",rowData.hindi,"hindi")+ renderRow("English Movies",rowData.english,"english"); } /* ========== INIT ========== */ (async function(){ allPosts=await loadPosts(); /* SORT ID BIG → SMALL */ allPosts.sort((a,b)=>parseInt(b.id)-parseInt(a.id)); if(!allPosts.length) return; /* RANDOM HERO */ const hero=allPosts[Math.floor(Math.random()*allPosts.length)]; const heroEl=document.querySelector(".hero"); const heroBg=document.getElementById("hero-bg"); const heroVideo=document.getElementById("hero-video"); heroBg.style.backgroundImage=url('${hero.poster}'); applyHeroGlow(hero.poster); document.getElementById("hero-title").textContent=hero.heading; document.getElementById("hero-link").href=post.html?id=${hero.id}; if(!isTouchDevice && hero.videoUrl){ heroVideo.src=hero.videoUrl; heroVideo.onloadeddata=()=>{ heroVideo.currentTime=8; heroVideo.play(); heroEl.classList.add("video-active"); }; } renderHome(); })(); </script> </body> </html>
