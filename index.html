<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yash OTT — Permanently Closed</title>

<link rel="icon" type="image/png"
href="https://res.cloudinary.com/dal4gg4v9/image/upload/w_1000,ar_16:9,c_fill,g_auto,e_sharpen/v1769530980/IMG_20260127_214934_ytx23w.png">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    background:#050608;
    color:#fff;
    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

/* ================= BACKGROUND ================= */

.closed-page{
    position:relative;
    width:100%;
    height:100vh;
    min-height:600px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(255,255,255,.055),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #050608 0%,
            #0a0c10 45%,
            #030405 100%
        );
}

/* Animated glow */

.glow{
    position:absolute;
    width:600px;
    height:600px;
    border-radius:50%;
    background:radial-gradient(
        circle,
        rgba(255,255,255,.07),
        transparent 68%
    );
    filter:blur(40px);
    animation:glowMove 8s ease-in-out infinite alternate;
}

@keyframes glowMove{
    0%{
        transform:translate(-120px,-80px) scale(.9);
        opacity:.35;
    }

    100%{
        transform:translate(120px,80px) scale(1.15);
        opacity:.7;
    }
}

/* ================= PARTICLES ================= */

.particles{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.particle{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:#fff;
    opacity:0;
    animation:floatParticle linear infinite;
}

@keyframes floatParticle{
    0%{
        transform:translateY(100vh) scale(.4);
        opacity:0;
    }

    15%{
        opacity:.35;
    }

    80%{
        opacity:.15;
    }

    100%{
        transform:translateY(-10vh) scale(1);
        opacity:0;
    }
}

/* ================= CONTENT ================= */

.content{
    position:relative;
    z-index:5;
    width:min(700px,90%);
    text-align:center;
    padding:40px 20px;

    animation:
        contentIn 1.2s cubic-bezier(.16,1,.3,1) forwards;
}

@keyframes contentIn{
    from{
        opacity:0;
        transform:translateY(40px) scale(.96);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

/* ================= LOGO ================= */

.logo{
    width:110px;
    height:110px;
    margin:0 auto 30px;

    border-radius:28px;

    object-fit:cover;

    box-shadow:
        0 0 0 1px rgba(255,255,255,.08),
        0 20px 60px rgba(0,0,0,.7);

    animation:
        logoAppear 1.2s cubic-bezier(.16,1,.3,1),
        logoFloat 5s ease-in-out 1.3s infinite;
}

@keyframes logoAppear{
    from{
        opacity:0;
        transform:scale(.65) rotate(-8deg);
        filter:blur(8px);
    }

    to{
        opacity:1;
        transform:scale(1) rotate(0);
        filter:blur(0);
    }
}

@keyframes logoFloat{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-8px);
    }
}

/* ================= STATUS ================= */

.status{
    display:inline-flex;
    align-items:center;
    gap:9px;

    padding:8px 15px;

    border:1px solid rgba(255,255,255,.12);
    border-radius:30px;

    background:rgba(255,255,255,.035);

    color:#aaa;

    font-size:13px;
    letter-spacing:1.5px;
    text-transform:uppercase;

    margin-bottom:22px;

    animation:fadeUp .9s .3s both;
}

.status-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#888;
    box-shadow:0 0 12px #888;
}

/* ================= TITLE ================= */

h1{
    font-size:clamp(42px,8vw,78px);
    line-height:.95;
    font-weight:800;
    letter-spacing:-3px;

    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            #d9d9d9 45%,
            #777 100%
        );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;

    animation:fadeUp 1s .45s both;
}

.subtitle{
    margin-top:22px;

    color:#999;

    font-size:clamp(15px,2vw,18px);
    line-height:1.7;

    max-width:560px;
    margin-left:auto;
    margin-right:auto;

    animation:fadeUp 1s .6s both;
}

/* ================= DIVIDER ================= */

.divider{
    width:0;
    height:1px;

    margin:30px auto;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.5),
            transparent
        );

    animation:dividerIn 1.2s .8s forwards;
}

@keyframes dividerIn{
    to{
        width:220px;
    }
}

/* ================= FOOTER ================= */

.footer{
    color:#555;
    font-size:12px;
    letter-spacing:.5px;

    animation:fadeUp 1s 1s both;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(18px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* ================= VIGNETTE ================= */

.vignette{
    position:absolute;
    inset:0;
    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 35%,
            rgba(0,0,0,.7) 100%
        );
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    .closed-page{
        min-height:500px;
    }

    .logo{
        width:90px;
        height:90px;
        border-radius:23px;
        margin-bottom:24px;
    }

    h1{
        letter-spacing:-2px;
    }

    .subtitle{
        padding:0 15px;
        line-height:1.6;
    }

    .divider{
        margin:25px auto;
    }
}
</style>
</head>

<body>

<div class="closed-page">

    <div class="glow"></div>

    <div class="particles" id="particles"></div>

    <div class="content">

        <img
            class="logo"
            src="https://res.cloudinary.com/dal4gg4v9/image/upload/w_1000,ar_16:9,c_fill,g_auto,e_sharpen/v1769530980/IMG_20260127_214934_ytx23w.png"
            alt="Yash OTT"
        >

        <div class="status">
            <span class="status-dot"></span>
            Service Closed
        </div>

        <h1>Yash OTT</h1>

        <p class="subtitle">
            This service has been permanently closed.
            <br>
            Thank you for being part of the journey.
        </p>

        <div class="divider"></div>

        <div class="footer">
            Yash OTT &nbsp;•&nbsp; Permanently Closed
        </div>

    </div>

    <div class="vignette"></div>

</div>


<script>

/* ================= PARTICLE GENERATOR ================= */

const particleContainer =
    document.getElementById("particles");

for(let i = 0; i < 35; i++){

    const particle =
        document.createElement("span");

    particle.className = "particle";

    particle.style.left =
        Math.random() * 100 + "%";

    particle.style.animationDuration =
        (8 + Math.random() * 12) + "s";

    particle.style.animationDelay =
        (-Math.random() * 15) + "s";

    const size =
        1 + Math.random() * 2;

    particle.style.width = size + "px";
    particle.style.height = size + "px";

    particleContainer.appendChild(particle);
}

</script>

</body>
</html>
