<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yash OTT</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

<style>
body{
  background:#0f1115;
  color:#fff;
  font-family: system-ui, -apple-system, BlinkMacSystemFont;
}

/* ===== HERO ===== */
.hero{
  position:relative;
  height:60vh;
  border-radius:18px;
  overflow:hidden;
  margin:20px;
}
.hero-bg{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center;
  filter:blur(22px) brightness(.55);
  transform:scale(1.2);
}
.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom,rgba(0,0,0,.2),rgba(0,0,0,.95));
}
.hero-content{
  position:relative;
  z-index:2;
  padding:40px;
  max-width:600px;
}

/* ===== SEARCH ===== */
.search-wrap{
  position:relative;
  max-width:500px;
  margin:0 20px 30px;
}
.search-suggest{
  position:absolute;
  top:100%;
  left:0;
  right:0;
  background:#1a1d24;
  border-radius:10px;
  max-height:300px;
  overflow-y:auto;
  display:none;
  z-index:50;
}
.search-suggest div{
  padding:10px;
  cursor:pointer;
  border-bottom:1px solid #2a2e38;
}
.search-suggest div:hover{
  background:#2a2e38;
}

/* ===== ROW HEADER ===== */
.row-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:20px 20px 10px;
}
.row-header h4{
  margin:0;
  font-size:18px;
}
.view-all{
  font-size:14px;
  color:#bbb;
  cursor:pointer;
}
.view-all:hover{
  color:#fff;
  text-decoration:underline;
}

/* ===== ROW ===== */
.ott-row{
  display:flex;
  gap:14px;
  overflow-x:auto;
  padding:0 20px 10px;
  scroll-behavior:smooth;
}
.ott-row::-webkit-scrollbar{
  height:6px;
}
.ott-row::-webkit-scrollbar-thumb{
  background:#333;
  border-radius:10px;
}

/* ===== CARD ===== */
.ott-card{
  min-width:160px;
  cursor:pointer;
  transition:transform .3s ease;
}
.ott-card:hover{
  transform:scale(1.08);
}
.ott-card img{
  width:100%;
  height:240px;
  object-fit:cover;
  border-radius:14px;
}
.ott-title{
  font-size:14px;
  text-align:center;
  margin-top:6px;
  color:#ccc;
}

/* ===== VIEW ALL GRID ===== */
.view-all-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:18px;
  padding:20px;
}

/* ===== FADE ===== */
.fade-in{
  opacity:0;
  animation:fade .6s ease forwards;
}
@keyframes fade{to{opacity:1}}

footer{
  text-align:center;
  color:#777;
  margin:30px 0;
}
</style>
</head>

<body>

<div class="container-fluid">

  <!-- HERO -->
  <div class="hero fade-in">
    <div class="hero-bg" id="hero-bg"></div>
    <div class="hero-content">
      <h1 id="hero-title">Loading…</h1>
      <p class="text-muted">Watch movies OTT style</p>
      <a id="hero-link" class="btn btn-light">Watch Now</a>
    </div>
  </div>

  <!-- SEARCH -->
  <div class="search-wrap">
    <input id="searchInput" class="form-control" placeholder="Search movies…">
    <div class="search-suggest" id="suggestBox"></div>
  </div>

  <!-- ROWS -->
  <div id="rows"></div>

</div>

<footer>Data provided by YASH</footer>

<script>
/* =====================
   CONFIG + CACHE
===================== */
const POSTS_JSON_URL="posts.json";
const CACHE_TTL=24*60*60*1000;

let allPosts=[];
let currentViewAll=null;

/* =====================
   CACHE UTILS
===================== */
function getCache(k){
  try{
    const r=localStorage.getItem(k);
    if(!r) return null;
    const o=JSON.parse(r);
    if(Date.now()-o.time>CACHE_TTL){
      localStorage.removeItem(k); return null;
    }
    return o.data;
  }catch{return null}
}
function setCache(k,d){
  try{
    localStorage.setItem(k,JSON.stringify({time:Date.now(),data:d}));
  }catch{}
}

/* =====================
   LOAD POSTS
===================== */
async function loadPosts(){
  const c=getCache("posts_cache");
  if(c) return c;
  try{
    const r=await fetch(POSTS_JSON_URL);
    const d=(await r.json()).filter(p=>p.heading);
    setCache("posts_cache",d);
    return d;
  }catch{return[]}
}

/* =====================
   VIEW ALL MODE
===================== */
function showViewAll(title,list){
  const rows=document.getElementById("rows");
  rows.innerHTML=`
    <div class="row-header">
      <h4>${title}</h4>
      <span class="view-all" onclick="renderHome()">⬅ Back</span>
    </div>
    <div class="view-all-grid">
      ${list.map(p=>`
        <div class="ott-card" onclick="location.href='post.html?id=${p.id}'">
          <img src="${p.poster}" onerror="this.src='https://via.placeholder.com/300x450'">
          <div class="ott-title">${p.heading}</div>
        </div>
      `).join("")}
    </div>
  `;
}

/* =====================
   RENDER ROW
===================== */
function renderRow(title,list,key){
  if(!list.length) return "";
  return `
    <div class="row-header">
      <h4>${title}</h4>
      <span class="view-all" onclick="showViewAll('${title}', window.rowData['${key}'])">
        View All
      </span>
    </div>
    <div class="ott-row">
      ${list.slice(0,15).map(p=>`
        <div class="ott-card" onclick="location.href='post.html?id=${p.id}'">
          <img src="${p.poster}" onerror="this.src='https://via.placeholder.com/300x450'">
          <div class="ott-title">${p.heading}</div>
        </div>
      `).join("")}
    </div>
  `;
}

/* =====================
   SEARCH SUGGESTIONS
===================== */
const searchInput=document.getElementById("searchInput");
const suggestBox=document.getElementById("suggestBox");

searchInput.oninput=function(){
  const q=this.value.toLowerCase();
  if(!q){
    suggestBox.style.display="none";
    return;
  }
  const matches=allPosts.filter(p=>p.heading.toLowerCase().includes(q)).slice(0,8);
  if(!matches.length){
    suggestBox.style.display="none";
    return;
  }
  suggestBox.innerHTML=matches.map(p=>`
    <div onclick="location.href='post.html?id=${p.id}'">${p.heading}</div>
  `).join("");
  suggestBox.style.display="block";
};

document.onclick=e=>{
  if(!searchInput.contains(e.target)){
    suggestBox.style.display="none";
  }
};

/* =====================
   HOME RENDER
===================== */
function renderHome(){
  const rows=document.getElementById("rows");

  window.rowData={
    latest: allPosts,
    telugu: allPosts.filter(p=>p.language==="Telugu"),
    hindi: allPosts.filter(p=>p.language==="Hindi"),
    english: allPosts.filter(p=>p.language==="English")
  };

  rows.innerHTML=
    renderRow("Latest Movies", rowData.latest, "latest") +
    renderRow("Telugu Movies", rowData.telugu, "telugu") +
    renderRow("Hindi Movies", rowData.hindi, "hindi") +
    renderRow("English Movies", rowData.english, "english");
}

/* =====================
   INIT
===================== */
(async function(){
  allPosts=await loadPosts();

  /* SORT BIG → SMALL */
  allPosts.sort((a,b)=>parseInt(b.id)-parseInt(a.id));

  if(!allPosts.length) return;

  /* HERO */
  const hero=allPosts[0];
  document.getElementById("hero-bg").style.backgroundImage=`url('${hero.poster}')`;
  document.getElementById("hero-title").textContent=hero.heading;
  document.getElementById("hero-link").href=`post.html?id=${hero.id}`;

  renderHome();
})();
</script>

</body>
</html>
