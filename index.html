<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yash OTT</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

<style>
body{
  background:#0f1115;
  color:#fff;
  font-family:system-ui,-apple-system,BlinkMacSystemFont;
}

/* ================= SEARCH ================= */
.search-wrap{
  position:sticky;
  top:0;
  z-index:1000;
  padding:15px 20px;
  background:#0f1115;
}
#searchInput{
  width:100%;
  padding:12px 16px;
  border-radius:30px;
  border:none;
  outline:none;
  background:#1a1d24;
  color:#fff;
}
#searchInput::placeholder{color:#888}
#searchSuggestions{
  position:absolute;
  left:20px;
  right:20px;
  top:65px;
  background:#151821;
  border-radius:14px;
  max-height:360px;
  overflow-y:auto;
  display:none;
}
.suggestion{
  display:flex;
  gap:12px;
  padding:10px;
  cursor:pointer;
}
.suggestion:hover{background:#1f2330}
.suggestion img{
  width:50px;
  height:70px;
  border-radius:8px;
  object-fit:cover;
}

/* ================= SKELETON ================= */
.skeleton{
  background:#1a1d24;
  border-radius:14px;
  position:relative;
  overflow:hidden;
}
.skeleton::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    110deg,
    rgba(255,255,255,0) 30%,
    rgba(255,255,255,.08) 45%,
    rgba(255,255,255,0) 60%
  );
  animation:shimmer 1.2s infinite;
}
@keyframes shimmer{
  from{transform:translateX(-100%)}
  to{transform:translateX(100%)}
}
.hero-skeleton{
  height:60vh;
  margin:20px;
  border-radius:18px;
}
.card-skeleton{
  min-width:160px;
  height:240px;
  flex:0 0 auto;
}

/* ================= HERO ================= */
.hero{
  display:none;
  position:relative;
  height:60vh;
  border-radius:18px;
  overflow:hidden;
  margin:20px;
}
.hero-bg{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:top;
  filter:blur(1px) brightness(.55);
  transform:scale(1.2);
}
#hero-video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
  transition:opacity .6s;
}
.hero.video-active #hero-video{opacity:1}
.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom,rgba(0,0,0,.2),rgba(0,0,0,.95));
}
.hero-content{
  position:relative;
  z-index:2;
  padding:40px;
  max-width:600px;
}
.hero:hover #hero-video { opacity: 1 !important; }


/* ================= ROWS ================= */
.row-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:20px 20px 10px;
}
.view-all{
  font-size:14px;
  color:#bbb;
  cursor:pointer;
}
.view-all:hover{color:#fff;text-decoration:underline}
.ott-row{
  display:flex;
  gap:14px;
  overflow-x:auto;
  padding:0 20px 10px;
}

/* ================= CARD ================= */
.preview-card{
  position:relative;
  min-width:160px;
  cursor:pointer;
}
.preview-card img,
.preview-card video{
  width:100%;
  height:240px;
  object-fit:cover;
  border-radius:14px;
}
.preview-card video{
  position:absolute;
  inset:0;
  opacity:0;
  pointer-events:none;
}
    
.preview-card:hover img{opacity:100%}
.ott-title{
  font-size:14px;
  text-align:center;
  margin-top:6px;
  color:#ccc;
}
/* ===== VIEW ALL GRID RESPONSIVE FIX ===== */
.view-all-grid{
  display:grid;
  gap:18px;
  padding:20px;
}

/* Mobile (2 columns) */
@media (max-width:575px){
  .view-all-grid{
    grid-template-columns:repeat(2,1fr);
  }
}

/* Tablet (3 columns) */
@media (min-width:576px) and (max-width:991px){
  .view-all-grid{
    grid-template-columns:repeat(3,1fr);
  }
}

/* Desktop / Large screens (5 columns) */
@media (min-width:992px){
  .view-all-grid{
    grid-template-columns:repeat(5,1fr);
  }
}
/* ================= HERO ================= */
.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    to bottom,
    rgba(0,0,0,.2),
    rgba(0,0,0,.95)
  );
  pointer-events: none; /* 🔑 IMPORTANT */
}


</style>
</head>

<body>

<div class="container-fluid">

<!-- SEARCH -->
<div class="search-wrap">
  <input id="searchInput" placeholder="Search movies..." autocomplete="off">
  <div id="searchSuggestions"></div>
</div>

<!-- HERO SKELETON -->
<div class="skeleton hero-skeleton" id="hero-skeleton"></div>

<!-- HERO -->
<div class="hero">
  <div class="hero-bg" id="hero-bg"></div>
  <video id="hero-video" muted loop playsinline preload="metadata"></video>
  <div class="hero-content">
    <h1 id="hero-title"></h1>
    <a id="hero-link" class="btn btn-light">Watch Now</a>
  </div>
</div>

<!-- ROWS -->
<div id="rows">
  <div class="row-header"><h4>Loading…</h4></div>
  <div class="ott-row">
    <div class="skeleton card-skeleton"></div>
    <div class="skeleton card-skeleton"></div>
    <div class="skeleton card-skeleton"></div>
    <div class="skeleton card-skeleton"></div>
  </div>
</div>

</div>

<script>
  
const POSTS_JSON_URL="posts.json";
const isTouch=('ontouchstart'in window)||navigator.maxTouchPoints>0;
const isLowEnd=navigator.hardwareConcurrency<=4||navigator.deviceMemory<=4;
let allPosts=[];
const heroBg = document.getElementById("hero-bg");
const heroTitle = document.getElementById("hero-title");
const heroLink = document.getElementById("hero-link");
const heroSkeleton = document.getElementById("hero-skeleton");
const heroBox = document.querySelector(".hero");
const rows = document.getElementById("rows");


/* ===== TMDB CONFIG ===== */
const TMDB_API_KEY="532a88c1ce983a87d6b28e49ad40a68e";
const TMDB_IMG="https://image.tmdb.org/t/p/original";
const BACKDROP_TTL=86400000;

/* ========== AUDIO FADE ========== */
function fadeInAudio(v){
  v.muted=false;v.volume=0;
  let vol=0;
  v._fade=setInterval(()=>{
    vol+=0.1;
    v.volume=Math.min(vol,0.6);
    if(vol>=0.6) clearInterval(v._fade);
  },80);
}

/* ========== AUTO PAUSE OFFSCREEN ========== */
const observer=new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(!e.isIntersecting){
      const v=e.target.querySelector("video");
      if(v){
        clearInterval(v._loopTimer);
        v.pause();
      }
    }
  });
},{threshold:.3});




/* ===== FETCH BACKDROP ===== */
async function fetchBackdrop(title){
  try{
    const res=await fetch(
      `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(title)}`
    );
    const data=await res.json();
    const movie=data.results?.find(m=>m.backdrop_path);
    return movie?TMDB_IMG+movie.backdrop_path:null;
  }catch{return null;}
}

/* ===== CARD HTML ===== */
function cardHTML(p){
return `
<div class="preview-card" data-id="${p.id}"
${isTouch?`
onclick="
  const v=this.querySelector('video');
  if(!v){location.href='post.html?id=${p.id}';return;}
  if(!v._playing){
    v.muted=true;
    v.currentTime=Math.random()*(v.duration-4);
    v.play();v._playing=true;
  }else location.href='post.html?id=${p.id}';
"`:""}>
<img src="${p.poster}" class="skeleton"
 onload="this.classList.remove('skeleton')">
${!isTouch && p.videoUrl?`
<video muted preload="none" playsinline>
  <source src="${p.videoUrl}" type="video/mp4">
</video>`:""}
<div class="ott-title">${p.heading}</div>
</div>`;
}

/* ===== ROWS ===== */
function renderRow(title,list,key){
  if(!list.length) return "";
  return `
  <div class="row-header">
    <h4>${title}</h4>
    <span class="view-all" onclick="showViewAll('${title}','${key}')">View All</span>
  </div>
  <div class="ott-row">
    ${list.slice(0,15).map(cardHTML).join("")}
  </div>`;
}

function showViewAll(title,key){
  rows.innerHTML=`
    <div class="row-header">
      <h4>${title}</h4>
      <span class="view-all" onclick="renderHome()">⬅ Back</span>
    </div>
    <div class="view-all-grid">
      ${rowData[key].map(cardHTML).join("")}
    </div>`;
}

function renderHome(){
  window.rowData={
  latest:[...allPosts].sort((a,b)=>b.id-a.id),
  telugu:allPosts.filter(p=>p.language==="Telugu"),
  hindi:allPosts.filter(p=>p.language==="Hindi"),
  english:allPosts.filter(p=>p.language==="English")
};


  rows.innerHTML=
    renderRow("Latest Movies",rowData.latest,"latest")+
    renderRow("Telugu Movies",rowData.telugu,"telugu")+
    renderRow("Hindi Movies",rowData.hindi,"hindi")+
    renderRow("English Movies",rowData.english,"english");
}

/* ===== DESKTOP CLICK FIX ===== */
document.addEventListener("click",e=>{
  const card=e.target.closest(".preview-card");
  if(card && !isTouch){
    location.href=`post.html?id=${card.dataset.id}`;
  }
});



/* ===== SEARCH ===== */
const searchInput=document.getElementById("searchInput");
const suggestions=document.getElementById("searchSuggestions");

searchInput.addEventListener("input",()=>{
  const q=searchInput.value.toLowerCase().trim();
  if(!q){suggestions.style.display="none";return;}
  const res=allPosts.filter(p=>p.heading.toLowerCase().includes(q)).slice(0,8);
  if(!res.length){suggestions.style.display="none";return;}
  suggestions.innerHTML=res.map(p=>`
    <div class="suggestion" onclick="location.href='post.html?id=${p.id}'">
      <img src="${p.poster}"><div>${p.heading}</div>
    </div>`).join("");
  suggestions.style.display="block";
});

/* ===== ADVANCED 3D TILT (OPTIONAL) ===== */
if(!isTouch){
  document.addEventListener("mousemove", e=>{
    const card = e.target.closest(".preview-card");
    if(!card) return;

    const r = card.getBoundingClientRect();
    const x = e.clientX - r.left;
    const y = e.clientY - r.top;

    const rx = ((y / r.height) - 0.5) * -10;
    const ry = ((x / r.width) - 0.5) * 10;

    card.style.transform =
      `perspective(900px)
       translateY(-10px)
       rotateX(${rx}deg)
       rotateY(${ry}deg)
       scale(1.04)`;
  });

  document.addEventListener("mouseleave", e=>{
    const card = e.target.closest(".preview-card");
    if(card){
      card.style.transform="";
    }
  }, true);
}
const heroVideo = document.getElementById('hero-video');

// Hero video hover



/* ===== INIT (SAFE) ===== */
(async()=>{
try{
  const res=await fetch(POSTS_JSON_URL);
  if(!res.ok) throw new Error("posts.json missing");
  allPosts=(await res.json()).filter(p=>p.heading);
  if(!allPosts.length) throw new Error("No posts");

const hero = allPosts[Math.floor(Math.random()*allPosts.length)];
const backdrop = await fetchBackdrop(hero.heading);

heroBg.style.backgroundImage = `url('${backdrop || hero.poster}')`;
heroTitle.textContent = hero.heading;
heroLink.href = `post.html?id=${hero.id}`;

// ADD THESE 3 LINES - loads videoUrl into hero
const heroVideo=document.getElementById("hero-video");
if(hero.videoUrl){
  heroVideo.src=hero.videoUrl;
  heroVideo.onloadedmetadata=()=>{
    const s=heroVideo.duration*.4;
    const e=heroVideo.duration*.6;
    heroVideo.currentTime=s+Math.random()*(e-s);
    heroVideo.play();
    document.querySelector(".hero").classList.add("video-active");
  };
}

document.getElementById("hero-skeleton").remove();
document.querySelector(".hero").style.display = "block";


  renderHome();
}catch(err){
  console.error(err);
  document.getElementById("hero-skeleton").innerHTML=
    "<h3 style='padding:40px'>Failed to load content</h3>";
}
})();
</script>

</body>
</html>
