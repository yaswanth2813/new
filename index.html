```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yash OTT — Coming Soon</title>

<link rel="icon" type="image/png"
href="https://res.cloudinary.com/dal4gg4v9/image/upload/w_1000,ar_16:9,c_fill,g_auto,e_sharpen/v1769530980/IMG_20260127_214934_ytx23w.png">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    background:#030405;
    color:#fff;
    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

/* ================= MAIN ================= */

.page{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(255,255,255,.055),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #020304,
            #0b0d11 50%,
            #020304
        );
}

/* ================= AMBIENT GLOW ================= */

.glow{
    position:absolute;

    width:650px;
    height:650px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.09) 0%,
            rgba(255,255,255,.035) 30%,
            transparent 70%
        );

    filter:blur(45px);

    animation:
        glowMove 9s ease-in-out infinite alternate;
}

@keyframes glowMove{

    0%{
        transform:
            translate(-180px,-80px)
            scale(.8);
        opacity:.35;
    }

    50%{
        opacity:.65;
    }

    100%{
        transform:
            translate(180px,100px)
            scale(1.15);
        opacity:.4;
    }
}

/* ================= PARTICLES ================= */

.particles{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.particle{
    position:absolute;

    width:2px;
    height:2px;

    border-radius:50%;

    background:#fff;

    opacity:0;

    animation:
        particleFloat linear infinite;
}

@keyframes particleFloat{

    0%{
        transform:
            translateY(105vh)
            scale(.3);

        opacity:0;
    }

    15%{
        opacity:.4;
    }

    80%{
        opacity:.12;
    }

    100%{
        transform:
            translateY(-10vh)
            scale(1);

        opacity:0;
    }
}

/* ================= CONTENT ================= */

.content{

    position:relative;
    z-index:5;

    width:min(720px,92%);

    text-align:center;

    padding:35px 20px;

    animation:
        contentReveal
        1.3s
        cubic-bezier(.16,1,.3,1)
        forwards;
}

@keyframes contentReveal{

    from{
        opacity:0;
        transform:
            translateY(50px)
            scale(.94);
        filter:blur(8px);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
        filter:blur(0);
    }
}

/* ================= LOGO ================= */

.logo{

    width:115px;
    height:115px;

    object-fit:cover;

    border-radius:30px;

    margin-bottom:30px;

    box-shadow:
        0 0 0 1px rgba(255,255,255,.08),
        0 20px 70px rgba(0,0,0,.8);

    animation:
        logoIn 1.2s
        cubic-bezier(.16,1,.3,1),
        logoFloat 5s
        ease-in-out
        1.3s
        infinite;
}

@keyframes logoIn{

    from{
        opacity:0;

        transform:
            scale(.55)
            rotate(-10deg);

        filter:
            blur(10px);
    }

    to{
        opacity:1;

        transform:
            scale(1)
            rotate(0);

        filter:
            blur(0);
    }
}

@keyframes logoFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-8px);
    }
}

/* ================= BADGE ================= */

.badge{

    display:inline-flex;

    align-items:center;
    gap:9px;

    padding:9px 17px;

    border-radius:30px;

    border:1px solid rgba(255,255,255,.14);

    background:
        rgba(255,255,255,.045);

    backdrop-filter:blur(12px);

    color:#bdbdbd;

    font-size:12px;

    letter-spacing:2px;

    text-transform:uppercase;

    margin-bottom:23px;

    animation:
        fadeUp .9s .35s both;
}

.badge-dot{

    width:7px;
    height:7px;

    border-radius:50%;

    background:#fff;

    box-shadow:
        0 0 8px rgba(255,255,255,.8);

    animation:
        pulse 1.8s infinite;
}

@keyframes pulse{

    0%,100%{
        opacity:.35;
        transform:scale(.8);
    }

    50%{
        opacity:1;
        transform:scale(1.2);
    }
}

/* ================= TITLE ================= */

h1{

    font-size:
        clamp(50px,9vw,88px);

    line-height:.95;

    font-weight:850;

    letter-spacing:-4px;

    background:
        linear-gradient(
            180deg,
            #fff 0%,
            #eee 38%,
            #888 100%
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    animation:
        fadeUp 1s .5s both;
}

/* ================= SUBTITLE ================= */

.subtitle{

    margin:
        24px auto 0;

    max-width:580px;

    color:#929292;

    font-size:
        clamp(15px,2vw,18px);

    line-height:1.7;

    animation:
        fadeUp 1s .65s both;
}

/* ================= DIVIDER ================= */

.divider{

    width:0;
    height:1px;

    margin:30px auto;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.5),
            transparent
        );

    animation:
        dividerIn
        1.2s
        1s
        forwards;
}

@keyframes dividerIn{

    to{
        width:240px;
    }
}

/* ================= FOOTER ================= */

.footer{

    color:#555;

    font-size:12px;

    letter-spacing:.7px;

    animation:
        fadeUp 1s 1.15s both;
}

/* ================= FADE ================= */

@keyframes fadeUp{

    from{
        opacity:0;
        transform:translateY(18px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* ================= VIGNETTE ================= */

.vignette{

    position:absolute;
    inset:0;

    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 30%,
            rgba(0,0,0,.75) 100%
        );
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    .logo{
        width:90px;
        height:90px;
        border-radius:24px;
        margin-bottom:25px;
    }

    h1{
        letter-spacing:-2.5px;
    }

    .subtitle{
        padding:0 12px;
    }

    .divider{
        margin:25px auto;
    }
}
</style>
</head>

<body>

<div class="page">

    <div class="glow"></div>

    <div
        class="particles"
        id="particles">
    </div>

    <div class="content">

        <img
            class="logo"
            src="https://res.cloudinary.com/dal4gg4v9/image/upload/w_1000,ar_16:9,c_fill,g_auto,e_sharpen/v1769530980/IMG_20260127_214934_ytx23w.png"
            alt="Yash OTT"
        >

        <div class="badge">
            <span class="badge-dot"></span>
            Coming Soon
        </div>

        <h1>
            Yash OTT
        </h1>

        <p class="subtitle">
            Something exciting is on the way.
            <br>
            We're working behind the scenes to bring
            you a better streaming experience.
        </p>

        <div class="divider"></div>

        <div class="footer">
            Stay tuned &nbsp;•&nbsp; Yash OTT
        </div>

    </div>

    <div class="vignette"></div>

</div>

<script>

/* ================= PARTICLES ================= */

const container =
    document.getElementById("particles");

for(let i = 0; i < 45; i++){

    const p =
        document.createElement("span");

    p.className = "particle";

    p.style.left =
        Math.random() * 100 + "%";

    p.style.animationDuration =
        (8 + Math.random() * 14) + "s";

    p.style.animationDelay =
        (-Math.random() * 18) + "s";

    const size =
        1 + Math.random() * 2;

    p.style.width =
        size + "px";

    p.style.height =
        size + "px";

    container.appendChild(p);
}

</script>

</body>
</html>
```
