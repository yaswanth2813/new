<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Details</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
  background:#0f1115;
  color:#fff;
  font-family:system-ui,-apple-system,BlinkMacSystemFont;
}
.container{margin-top:30px}

/* ===== AMBIENCE ===== */
.ambience-wrapper{
  position:relative;
  overflow:hidden;
  border-radius:18px;
}
.ambience-bg{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center;
  filter:blur(1px) brightness(1.75); /* 70% visible */
  transform:scale(1.05);
  z-index:0;
}
.vignette{
  position:absolute;
  inset:0;
  z-index:2;
  background:radial-gradient(
    ellipse at center,
    rgba(0,0,0,.15) 40%,
    rgba(0,0,0,.65) 100%
  );
}
.ambience-content{
  position:relative;
  z-index:3;
  padding:28px;
}

/* ===== LAYOUT ===== */
.movie-layout{
  display:grid;
  grid-template-columns:360px 1fr;
  gap:28px;
}
@media(max-width:768px){
  .movie-layout{
    grid-template-columns:1fr;
    text-align:center;
  }
}

/* ===== POSTER ===== */
.poster-img{
  width:100%;
  max-width:360px;
  border-radius:14px;
  box-shadow:0 20px 50px rgba(0,0,0,.6);
}
@media(max-width:768px){
  .poster-img{margin:auto}
}

/* ===== INFO ===== */
.info-box{
  background:linear-gradient(to right,#3f4c6b,#606c88);
  border-radius:12px;
  padding:16px;
  margin-bottom:16px;
  color:#eef1f7;
}

/* ===== CAST ===== */
.cast-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
  gap:14px;
  margin-top:20px;
}
.cast-card{text-align:center;font-size:13px}
.cast-card img{
  width:100%;
  height:160px;
  object-fit:cover;
  border-radius:10px;
  background:#222;
  margin-bottom:6px;
}

/* ===== VIDEO ===== */
video{width:100%;border-radius:12px}

/* ===== BUTTON ===== */
.btn-grad{
  background-image:linear-gradient(to right,#757F9A 0%,#D7DDE8 51%,#757F9A 100%);
  padding:12px 36px;
  margin:10px 10px 0 0;
  background-size:200% auto;
  transition:.5s;
  border-radius:10px;
  color:#fff;
  text-decoration:none;
  display:inline-block;
}
.btn-grad:hover{background-position:right center}

/* ===== SKELETON ===== */
.skeleton{
  background:linear-gradient(90deg,#222 25%,#333 37%,#222 63%);
  background-size:400% 100%;
  animation:shimmer 1.4s infinite;
  border-radius:10px;
}
@keyframes shimmer{
  0%{background-position:100% 0}
  100%{background-position:-100% 0}
}
.sk-poster{height:420px}
.sk-title{height:26px;width:60%;margin-bottom:16px}
.sk-text{height:14px;margin-bottom:10px}
.sk-video{height:260px;margin-top:20px}
.sk-cast{height:160px}
</style>
</head>

<body>

<main class="container">
  <div id="movie-container"></div>
</main>

<script>
/* ================= CONFIG ================= */
const TMDB_API_KEY="532a88c1ce983a87d6b28e49ad40a68e";
const TMDB_BASE="https://api.themoviedb.org/3";
const TMDB_IMG="https://image.tmdb.org/t/p/";
const params=new URLSearchParams(location.search);
const id=parseInt(params.get("id"));
const src=params.get("src");
const POSTS_JSON_URL=src?`${src}/${src}.json`:"posts.json";

const container=document.getElementById("movie-container");

/* ================= SKELETON ================= */
container.innerHTML=`
<div class="ambience-wrapper">
  <div class="ambience-content movie-layout">
    <div class="skeleton sk-poster"></div>
    <div>
      <div class="skeleton sk-title"></div>
      <div class="skeleton sk-text"></div>
      <div class="skeleton sk-text"></div>
      <div class="skeleton sk-text"></div>
      <div class="cast-grid">
        ${Array(6).fill(0).map(()=>`<div class="skeleton sk-cast"></div>`).join("")}
      </div>
      <div class="skeleton sk-video"></div>
    </div>
  </div>
</div>`;

/* ================= FETCH HELPERS ================= */
async function fetchPosts(){
  const r=await fetch(POSTS_JSON_URL);
  return (await r.json()).filter(p=>p.heading);
}

/* 🔥 TELUGU-SAFE TMDB SEARCH */
async function fetchTMDBMovie(title,year){
  const url=`${TMDB_BASE}/search/movie?api_key=${TMDB_API_KEY}
    &query=${encodeURIComponent(title)}
    &year=${year}
    &language=te-IN
    &include_adult=false`;

  const r=await fetch(url);
  const data=await r.json();
  if(!data.results) return null;

  const t=title.toLowerCase();

  /* 1️⃣ Exact title match */
  let exact=data.results.find(m =>
    m.title?.toLowerCase()===t ||
    m.original_title?.toLowerCase()===t
  );

  /* 2️⃣ Telugu only */
  let telugu=data.results.find(m=>m.original_language==="te");

  return exact || telugu || null;
}

async function fetchCredits(id){
  const r=await fetch(`${TMDB_BASE}/movie/${id}/credits?api_key=${TMDB_API_KEY}`);
  return await r.json();
}

/* ================= INIT ================= */
(async()=>{
  const posts=await fetchPosts();
  const post=posts.find(p=>+p.id===id);
  if(!post){container.innerHTML="Movie not found";return;}

  let backdrop=post.poster;
  let plot="No plot available";
  let rating="N/A";
  let director=post.director||"N/A";
  let castHTML="";

  const movie=await fetchTMDBMovie(post.heading,post.year);

  /* 🚫 Block English hijack */
  if(movie && movie.original_language==="te"){
    backdrop=movie.backdrop_path?TMDB_IMG+"w1280"+movie.backdrop_path:backdrop;
    plot=movie.overview||plot;
    rating=movie.vote_average||rating;

    const credits=await fetchCredits(movie.id);
    const dir=credits.crew.find(c=>c.job==="Director");
    if(dir) director=dir.name;

    castHTML=credits.cast.slice(0,12).map(c=>`
      <div class="cast-card">
        <img src="${c.profile_path?TMDB_IMG+'w185'+c.profile_path:''}">
        <span>${c.name}</span>
      </div>
    `).join("");
  }

  container.innerHTML=`
  <div class="ambience-wrapper">
    <div class="ambience-bg" style="background-image:url('${backdrop}')"></div>
    <div class="vignette"></div>

    <div class="ambience-content movie-layout">
      <img src="${post.poster}" class="poster-img">

      <div>
        <h2>${post.heading} (${post.year})</h2>
        <p class="text-muted">⭐ ${rating}</p>

        <div class="info-box">
          <p><strong>Director:</strong> ${director}</p>
          <p><strong>Cast:</strong> ${post.starring}</p>
        </div>

        <div class="info-box"><strong>Plot:</strong> ${plot}</div>

        ${castHTML?`<h4 class="mt-3">Cast & Crew</h4><div class="cast-grid">${castHTML}</div>`:""}

        <div class="video-container mt-3">
          <video controls>
            <source src="${post.videoUrl}" type="video/mp4">
          </video>
        </div>

        <a href="${post.videoUrl}" target="_blank" class="btn-grad">Download</a>
        <a href="${src?src+'/index.html':'index.html'}" class="btn-grad">Back</a>
      </div>
    </div>
  </div>`;
})();
</script>

</body>
</html>
