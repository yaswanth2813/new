<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Details</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
  background:#0f1115;
  color:#fff;
  font-family:system-ui,-apple-system,BlinkMacSystemFont;
}
.container{margin-top:20px}

/* ===== HERO ===== */
.hero{
  position:relative;
  height:50vh;
  min-height:280px;
  border-radius:16px;
  overflow:visible;
}

/* backdrop only when image exists */
.hero-bg{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center;
  transform:scale(1.05);
  z-index:1;
}
.hero-bg.has-img{
  filter:blur(3px) brightness(.75);
}
.hero-vignette{
  position:relative;
  inset:0;
  background:linear-gradient(
    to bottom,
    rgba(0,0,0,.25),
    rgba(0,0,0,.9)
  );
  z-index:2;
}

/* ===== POSTER ===== */
.hero-poster{
  position:absolute;
  bottom:-80px;
  left:24px;
  width:220px;
  border-radius:14px;
  box-shadow:0 30px 60px rgba(0,0,0,.7);
  z-index:5;
  background:#111;
}

/* ===== HERO TEXT ===== */
.hero-text{
  position:absolute;
  bottom:24px;
  left:270px;
  right:20px;
  z-index:5;
}

/* ===== MOBILE FIX ===== */
@media(max-width:768px){
  .hero{
    height:auto;
    min-height:unset;
    padding:16px;
  }
  .hero-bg{
    position:absolute;
  }
  .hero-poster{
    position:relative;
    bottom:0;
    right:5;
    margin:0 auto 12px;
    width:200px;
    display:block;
  }
  .hero-text{
    position:relative;
    left:0;
    bottom:0;
    text-align:center;
  }
}

/* ===== CONTENT ===== */
.content{
  margin-top:120px;
}
@media(max-width:768px){
  .content{margin-top:20px}
}

/* ===== INFO ===== */
.info-box{
  background:linear-gradient(to right,#3f4c6b,#606c88);
  border-radius:12px;
  padding:14px;
  margin-bottom:14px;
  font-size:14px;
}

/* ===== CAST ===== */
.cast-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(90px,1fr));
  gap:12px;
  margin-top:16px;
}
.cast-card{text-align:center;font-size:12px}
.cast-card img{
  width:100%;
  height:130px;
  object-fit:cover;
  border-radius:10px;
  background:#222;
}

/* ===== VIDEO ===== */
video{
  width:100%;
  border-radius:12px;
  margin-top:12px;
}

/* ===== BUTTON ===== */
.btn-wrap{margin-top:14px}
.btn-grad{
  background-image:linear-gradient(to right,#757F9A,#D7DDE8,#757F9A);
  padding:10px 28px;
  margin:6px;
  border-radius:10px;
  color:#fff;
  text-decoration:none;
  display:inline-block;
  font-size:13px;
}
</style>
</head>

<body>

<main class="container">
  <div id="movie-container"></div>
</main>

<script>
const TMDB_API_KEY = "532a88c1ce983a87d6b28e49ad40a68e";
const TMDB_BASE = "https://api.themoviedb.org/3";
const TMDB_IMG  = "https://image.tmdb.org/t/p/";
const params = new URLSearchParams(location.search);
const id = parseInt(params.get("id"));
const src = params.get("src");
const POSTS_JSON_URL = src ? src + "/" + src + ".json" : "posts.json";
const container = document.getElementById("movie-container");

async function fetchPosts(){
  const r = await fetch(POSTS_JSON_URL);
  return (await r.json()).filter(p => p.heading);
}
async function fetchTMDBMovie(title,year){
  const r = await fetch(
    TMDB_BASE + "/search/movie?api_key=" + TMDB_API_KEY +
    "&query=" + encodeURIComponent(title) +
    "&year=" + year
  );
  return (await r.json()).results?.[0] || null;
}
async function fetchCredits(id){
  const r = await fetch(TMDB_BASE + "/movie/" + id + "/credits?api_key=" + TMDB_API_KEY);
  return await r.json();
}

(async()=>{
  const posts = await fetchPosts();
  const post = posts.find(p => +p.id === id);
  if(!post){ container.innerHTML="Movie not found"; return; }

  let backdrop = post.poster;
  let hasBackdrop = false;
  let plot="No plot available", rating="N/A", director=post.director||"N/A";
  let castHTML="";

  const movie = await fetchTMDBMovie(post.heading, post.year);
  if(movie){
    if(movie.backdrop_path){
      backdrop = TMDB_IMG + "w1280" + movie.backdrop_path;
      hasBackdrop = true;
    }
    plot = movie.overview || plot;
    rating = movie.vote_average || rating;

    const credits = await fetchCredits(movie.id);
    const dir = credits.crew.find(c=>c.job==="Director");
    if(dir) director = dir.name;

    castHTML = credits.cast.slice(0,10).map(c=>`
      <div class="cast-card">
        <img src="${c.profile_path ? TMDB_IMG+'w185'+c.profile_path : ''}">
        <span>${c.name}</span>
      </div>
    `).join("");
  }

  container.innerHTML = `
  <div class="hero">
    <div class="hero-bg ${hasBackdrop?'has-img':''}" style="background-image:url('${backdrop}')"></div>
    <div class="hero-vignette"></div>

    <img src="${post.poster}" class="hero-poster" alt="Poster">

    <div class="hero-text">
      <h4>${post.heading} (${post.year})</h4>
      <p class="text-muted">⭐ ${rating}</p>
    </div>
  </div>

  <div class="content">
    <div class="info-box">
      <strong>Director:</strong> ${director}<br>
      <strong>Cast:</strong> ${post.starring}
    </div>

    <div class="info-box"><strong>Plot:</strong> ${plot}</div>

    ${castHTML ? `<h5>Cast & Crew</h5><div class="cast-grid">${castHTML}</div>` : ""}

    <video controls>
      <source src="${post.videoUrl}" type="video/mp4">
    </video>

    <div class="btn-wrap">
      <a href="${post.videoUrl}" class="btn-grad" target="_blank">Download</a>
      <a href="${src?src+'/index.html':'index.html'}" class="btn-grad">Back</a>
    </div>
  </div>`;
})();
</script>

</body>
</html>
