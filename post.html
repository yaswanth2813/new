<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Details</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
  background:#0f1115;
  color:#fff;
  font-family:system-ui,-apple-system,BlinkMacSystemFont;
}
.container{margin-top:20px}

/* ===== HERO ===== */
.hero{
  position:relative;
  height:50vh;
  min-height:300px;
  border-radius:16px;
  overflow:hidden;
}
.hero-bg{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center;
  filter:blur(2px) brightness(.75);
  transform:scale(1.05);
}
.hero-vignette{
  position:absolute;
  inset:0;
  background:linear-gradient(
    to bottom,
    rgba(0,0,0,.2) 0%,
    rgba(0,0,0,.85) 100%
  );
}

/* ===== POSTER ON HERO ===== */
.hero-poster{
  position:relative;
  bottom:-80px;
  left:24px;
  width:220px;
  border-radius:14px;
  box-shadow:0 30px 60px rgba(0,0,0,.7);
  z-index:3;
}

/* ===== HERO TEXT ===== */
.hero-text{
  position:absolute;
  bottom:20px;
  left:270px;
  right:20px;
  z-index:3;
}
.hero-text h3{margin-bottom:6px}

@media(max-width:768px){
  .hero{
    height:auto;
    padding-bottom:20px;
  }
  .hero-poster{
    position:static;
    margin:20px auto 10px;
    width:200px;
  }
  .hero-text{
    position:static;
    text-align:center;
  }
}

/* ===== CONTENT ===== */
.content{
  margin-top:100px;
}
@media(max-width:768px){
  .content{margin-top:20px}
}

/* ===== INFO ===== */
.info-box{
  background:linear-gradient(to right,#3f4c6b,#606c88);
  border-radius:12px;
  padding:14px;
  margin-bottom:14px;
  color:#eef1f7;
  font-size:14px;
}

/* ===== CAST ===== */
.cast-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(90px,1fr));
  gap:12px;
  margin-top:16px;
}
.cast-card{text-align:center;font-size:12px}
.cast-card img{
  width:100%;
  height:130px;
  object-fit:cover;
  border-radius:10px;
  background:#222;
  margin-bottom:4px;
}

/* ===== VIDEO ===== */
video{
  width:100%;
  border-radius:12px;
  margin-top:12px;
}

/* ===== BUTTON ===== */
.btn-wrap{margin-top:14px}
.btn-grad{
  background-image:linear-gradient(to right,#757F9A 0%,#D7DDE8 51%,#757F9A 100%);
  padding:10px 28px;
  margin:6px;
  background-size:200% auto;
  transition:.5s;
  border-radius:10px;
  color:#fff;
  text-decoration:none;
  display:inline-block;
  font-size:13px;
}
.btn-grad:hover{background-position:right center}

/* ===== SKELETON ===== */
.skeleton{
  background:linear-gradient(90deg,#222 25%,#333 37%,#222 63%);
  background-size:400% 100%;
  animation:shimmer 1.4s infinite;
  border-radius:10px;
}
@keyframes shimmer{
  0%{background-position:100% 0}
  100%{background-position:-100% 0}
}
.sk-hero{height:50vh}
.sk-poster{width:220px;height:330px;margin:20px}
.sk-text{height:14px;margin-bottom:8px}
</style>
</head>

<body>

<main class="container">
  <div id="movie-container"></div>
</main>

<script>
/* ================= CONFIG ================= */
const TMDB_API_KEY="532a88c1ce983a87d6b28e49ad40a68e";
const TMDB_BASE="https://api.themoviedb.org/3";
const TMDB_IMG="https://image.tmdb.org/t/p/";
const params=new URLSearchParams(location.search);
const id=parseInt(params.get("id"));
const src=params.get("src");
const POSTS_JSON_URL=src?src+"/"+src+".json":"posts.json";
const container=document.getElementById("movie-container");

/* ================= SKELETON ================= */
container.innerHTML=`
<div class="hero skeleton sk-hero"></div>
<div class="content">
  <div class="skeleton sk-poster"></div>
  <div class="skeleton sk-text"></div>
  <div class="skeleton sk-text"></div>
</div>`;

/* ================= FETCH ================= */
async function fetchPosts(){
  const res=await fetch(POSTS_JSON_URL);
  return (await res.json()).filter(p=>p.heading);
}
async function fetchTMDBMovie(title,year){
  const url=TMDB_BASE+"/search/movie?api_key="+TMDB_API_KEY+
            "&query="+encodeURIComponent(title)+"&year="+year;
  const res=await fetch(url);
  if(!res.ok) return null;
  return (await res.json()).results?.[0]||null;
}
async function fetchCredits(id){
  const res=await fetch(TMDB_BASE+"/movie/"+id+"/credits?api_key="+TMDB_API_KEY);
  if(!res.ok) return null;
  return await res.json();
}

/* ================= INIT ================= */
(async()=>{
  const posts=await fetchPosts();
  const post=posts.find(p=>+p.id===id);
  if(!post){container.innerHTML="Movie not found";return;}

  let backdrop=post.poster, plot="No plot", rating="N/A",
      director=post.director||"N/A", castHTML="";

  const movie=await fetchTMDBMovie(post.heading,post.year);
  if(movie){
    backdrop=movie.backdrop_path?TMDB_IMG+"w1280"+movie.backdrop_path:backdrop;
    plot=movie.overview||plot;
    rating=movie.vote_average||rating;

    const credits=await fetchCredits(movie.id);
    if(credits){
      const dir=credits.crew.find(c=>c.job==="Director");
      if(dir) director=dir.name;
      castHTML=credits.cast.slice(0,10).map(c=>`
        <div class="cast-card">
          <img src="${c.profile_path?TMDB_IMG+'w185'+c.profile_path:''}">
          <span>${c.name}</span>
        </div>
      `).join("");
    }
  }

  container.innerHTML=`
  <div class="hero">
    <div class="hero-bg" style="background-image:url('${backdrop}')"></div>
    <div class="hero-vignette"></div>

    <img src="${post.poster}" class="hero-poster">

    <div class="hero-text">
      <h3>${post.heading} (${post.year})</h3>
      <p class="text-muted">⭐ ${rating}</p>
    </div>
  </div>

  <div class="content">
    <div class="info-box">
      <p><strong>Director:</strong> ${director}</p>
      <p><strong>Cast:</strong> ${post.starring}</p>
    </div>

    <div class="info-box"><strong>Plot:</strong> ${plot}</div>

    ${castHTML?`
      <h5 class="mt-3">Cast & Crew</h5>
      <div class="cast-grid">${castHTML}</div>
    `:""}

    <video controls>
      <source src="${post.videoUrl}" type="video/mp4">
    </video>

    <div class="btn-wrap">
      <a href="${post.videoUrl}" target="_blank" class="btn-grad">Download</a>
      <a href="${src?src+'/index.html':'index.html'}" class="btn-grad">Back</a>
    </div>
  </div>`;
})();
</script>

</body>
</html>
