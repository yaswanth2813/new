<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Movie Details</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <style>
    body {
      background-image: linear-gradient(to top, #c9ffbf 10%, #d5dee7 30%, #ace0f9 100%);
    }

    .container {
      margin-top: 30px;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      background: #fff;
    }

    /* 🎥 Ambience wrapper */
    .ambience-wrapper {
      position: relative;
      overflow: hidden;
      border-radius: 18px;
    }

    /* 📱 Android WebView–safe blur */
    .ambience-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: blur(18px) brightness(0.55);
      transform: scale(1.15);
      will-change: transform, filter;
      backface-visibility: hidden;
      z-index: 0;
    }

    @media (max-width: 480px) {
      .ambience-bg {
        filter: brightness(0.5);
        transform: scale(1.05);
      }
    }

    /* 🎬 Cinematic vignette */
    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background: radial-gradient(
        ellipse at center,
        rgba(0,0,0,0) 40%,
        rgba(0,0,0,0.65) 100%
      );
    }

    /* 🚀 Fade animation */
    .fade-in {
      opacity: 0;
      animation: fadeInUp 0.8s ease-out forwards;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .ambience-content {
      position: relative;
      z-index: 3;
      color: #fff;
    }

    .poster-img {
      max-width: 380px;
      width: 100%;
      border-radius: 12px;
    }

    .video-container {
      max-width: 800px;
    }

    video {
      width: 100%;
      border-radius: 12px;
    }

    .post-bg {
      background: linear-gradient(to right, #3f4c6b, #606c88);
      color: #d7dde8;
    }

    .btn-grad {
      background-image: linear-gradient(to right, #757F9A 0%, #D7DDE8 51%, #757F9A 100%);
      padding: 14px 40px;
      margin-right: 10px;
      text-transform: uppercase;
      background-size: 200% auto;
      transition: 0.5s;
      border-radius: 10px;
      color: white;
      text-decoration: none;
      box-shadow: 0 0 20px #000;
      display: inline-block;
    }

    .btn-grad:hover {
      background-position: right center;
      color: #fff;
    }

    footer {
      text-align: center;
      margin: 20px 0;
      color: #777;
    }
  </style>
</head>

<body>

<main class="container">
  <div id="movie-container" class="text-center">
    Loading movie details...
  </div>
</main>

<footer>Data provided by YASH</footer>

<script>
  /* =========================
     CONFIG
     ========================= */
  const OMDB_KEY = "1f818a3f";
  const CACHE_TTL = 24 * 60 * 60 * 1000; // 24 hours

  const params = new URLSearchParams(window.location.search);
  const id = parseInt(params.get("id"));
  const src = params.get("src");
  const POSTS_JSON_URL = src ? `${src}/${src}.json` : "posts.json";

  /* =========================
     LOCALSTORAGE CACHE UTILS
     ========================= */
  function getCache(key) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return null;

      const cached = JSON.parse(raw);
      if (Date.now() - cached.time > CACHE_TTL) {
        localStorage.removeItem(key);
        return null;
      }
      return cached.data;
    } catch {
      return null;
    }
  }

  function setCache(key, data) {
    try {
      localStorage.setItem(key, JSON.stringify({
        time: Date.now(),
        data
      }));
    } catch {
      /* ignore storage errors */
    }
  }

  /* =========================
     FETCH POSTS (CACHED)
     ========================= */
  async function fetchPosts() {
    const cacheKey = `posts_${POSTS_JSON_URL}`;
    const cached = getCache(cacheKey);
    if (cached) return cached;

    try {
      const res = await fetch(POSTS_JSON_URL);
      const data = await res.json();
      setCache(cacheKey, data);
      return data;
    } catch {
      return [];
    }
  }

  /* =========================
     FETCH OMDB (CACHED)
     ========================= */
  async function fetchOMDB(title) {
    const cacheKey = `omdb_${title.toLowerCase().replace(/\s+/g, "_")}`;
    const cached = getCache(cacheKey);
    if (cached) return cached;

    try {
      const res = await fetch(
        `https://www.omdbapi.com/?apikey=${OMDB_KEY}&t=${encodeURIComponent(title)}&plot=full`
      );
      const data = await res.json();

      if (data.Response === "True") {
        setCache(cacheKey, data);
        return data;
      }
      return null;
    } catch {
      return null;
    }
  }

  /* =========================
     INIT
     ========================= */
  (async function init() {
    const container = document.getElementById("movie-container");

    if (!id || isNaN(id)) {
      container.innerHTML = "Invalid movie ID";
      return;
    }

    const posts = await fetchPosts();
    const post = posts.find(p => parseInt(p.id) === id);

    if (!post) {
      container.innerHTML = "Movie not found";
      return;
    }

    const omdb = await fetchOMDB(post.heading);

    const data = {
      poster: omdb?.Poster && omdb.Poster !== "N/A" ? omdb.Poster : post.poster,
      year: omdb?.Year || post.year || "N/A",
      rating: omdb?.imdbRating !== "N/A" ? `⭐ ${omdb.imdbRating}/10 IMDb` : "N/A",
      genre: omdb?.Genre || "Unknown",
      release: omdb?.Released || "N/A",
      runtime: omdb?.Runtime || "N/A",
      director: omdb?.Director || post.director || "N/A",
      cast: omdb?.Actors || post.starring || "N/A",
      plot: omdb?.Plot || "No plot available"
    };

    const backLink = src ? `${src}/index.html` : "index.html";

    container.innerHTML = `
      <div class="ambience-wrapper shadow-lg">
        <div class="ambience-bg" style="background-image:url('${data.poster}')"></div>
        <div class="vignette"></div>

        <div class="ambience-content p-4 fade-in">
          <h2 class="mb-3">${post.heading} (${data.year})</h2>

          <img src="${data.poster}" class="poster-img mb-4" alt="${post.heading}">

          <div class="post-bg rounded p-3 mb-3">
            <p><strong>Rating:</strong> ${data.rating}</p>
            <p><strong>Genre:</strong> ${data.genre}</p>
            <p><strong>Release:</strong> ${data.release}</p>
            <p><strong>Runtime:</strong> ${data.runtime}</p>
            <p><strong>Director:</strong> ${data.director}</p>
            <p><strong>Cast:</strong> ${data.cast}</p>
          </div>

          <div class="post-bg rounded p-3 mb-4">
            <strong>Plot:</strong> ${data.plot}
          </div>

          <div class="video-container mb-4">
            <video controls preload="metadata" controlsList="nodownload">
              <source src="${post.videoUrl}" type="video/mp4">
            </video>
          </div>

          <a href="${post.videoUrl}" target="_blank" class="btn-grad">Download</a>
          <a href="${backLink}" class="btn-grad">Back to List</a>
        </div>
      </div>
    `;
  })();
</script>

</body>
</html>
