<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movie Details</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #0f1115;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont;
    }

    .container {
      margin-top: 30px;
    }

    /* ===== AMBIENCE ===== */
    .ambience-wrapper {
      position: relative;
      overflow: hidden;
      border-radius: 18px;
    }

    .ambience-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: blur(18px) brightness(0.55);
      transform: scale(1.15);
      will-change: transform, filter;
      z-index: 0;
    }

    @media (max-width: 480px) {
      .ambience-bg {
        filter: brightness(0.5);
        transform: scale(1.05);
      }
    }

    /* ===== CINEMATIC VIGNETTE ===== */
    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background: radial-gradient(
        ellipse at center,
        rgba(0,0,0,0) 40%,
        rgba(0,0,0,0.65) 100%
      );
    }

    /* ===== FADE IN ===== */
    .fade-in {
      opacity: 0;
      animation: fadeInUp 0.8s ease-out forwards;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .ambience-content {
      position: relative;
      z-index: 3;
      padding: 24px;
    }

    .poster-img {
      width: 100%;
      max-width: 360px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .info-box {
      background: linear-gradient(to right, #3f4c6b, #606c88);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      color: #d7dde8;
    }

    .video-container {
      max-width: 900px;
      margin-bottom: 20px;
    }

    video {
      width: 100%;
      border-radius: 12px;
    }

    .btn-grad {
      background-image: linear-gradient(to right, #757F9A 0%, #D7DDE8 51%, #757F9A 100%);
      padding: 14px 40px;
      margin-right: 10px;
      text-transform: uppercase;
      background-size: 200% auto;
      transition: 0.5s;
      border-radius: 10px;
      color: #fff;
      text-decoration: none;
      display: inline-block;
      box-shadow: 0 0 20px #000;
    }

    .btn-grad:hover {
      background-position: right center;
    }

    footer {
      text-align: center;
      color: #777;
      margin: 30px 0;
      font-size: 14px;
    }
  </style>
</head>

<body>

<main class="container">
  <div id="movie-container" class="text-center">
    Loading movie details...
  </div>
</main>

<footer>Data provided by YASH</footer>

<script>
/* =====================
   CONFIG
===================== */
const CACHE_TTL = 24 * 60 * 60 * 1000;
const params = new URLSearchParams(window.location.search);
const id = parseInt(params.get("id"));
const src = params.get("src");
const POSTS_JSON_URL = src ? `${src}/${src}.json` : "posts.json";

/* =====================
   CACHE UTILS
===================== */
function getCache(key) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    if (Date.now() - obj.time > CACHE_TTL) {
      localStorage.removeItem(key);
      return null;
    }
    return obj.data;
  } catch {
    return null;
  }
}

function setCache(key, data) {
  try {
    localStorage.setItem(key, JSON.stringify({
      time: Date.now(),
      data
    }));
  } catch {}
}

/* =====================
   FETCH POSTS (JSON FIRST)
===================== */
async function fetchPosts() {
  const cacheKey = `posts_${POSTS_JSON_URL}`;
  const cached = getCache(cacheKey);
  if (cached) return cached;

  try {
    const res = await fetch(POSTS_JSON_URL);
    const data = await res.json();
    setCache(cacheKey, data);
    return data;
  } catch {
    return [];
  }
}

/* =====================
   OPTIONAL OMDB (SAFE)
===================== */
async function fetchOMDB(title) {
  const cacheKey = `omdb_${title.toLowerCase().replace(/\s+/g, "_")}`;
  const cached = getCache(cacheKey);
  if (cached) return cached;

  // API disabled or limit reached → skip safely
  return null;
}

/* =====================
   INIT
===================== */
(async function init() {
  const container = document.getElementById("movie-container");

  if (!id || isNaN(id)) {
    container.innerHTML = "Invalid movie ID";
    return;
  }

  const posts = await fetchPosts();
  const post = posts.find(p => parseInt(p.id) === id);

  if (!post) {
    container.innerHTML = "Movie not found";
    return;
  }

  // Base data from JSON (never fails)
  const data = {
    poster: post.poster,
    year: post.year || "N/A",
    rating: "N/A",
    genre: "N/A",
    release: "N/A",
    runtime: "N/A",
    director: post.director || "N/A",
    cast: post.starring || "N/A",
    plot: "No plot available"
  };

  const backLink = src ? `${src}/index.html` : "index.html";

  container.innerHTML = `
    <div class="ambience-wrapper shadow-lg fade-in">
      <div class="ambience-bg" style="background-image:url('${data.poster}')"></div>
      <div class="vignette"></div>

      <div class="ambience-content">
        <h2 class="mb-3">${post.heading} (${data.year})</h2>

        <img src="${data.poster}" class="poster-img" alt="${post.heading}">

        <div class="info-box">
          <p><strong>Director:</strong> ${data.director}</p>
          <p><strong>Cast:</strong> ${data.cast}</p>
        </div>

        <div class="info-box">
          <strong>Plot:</strong> ${data.plot}
        </div>

        <div class="video-container">
          <video controls preload="metadata" controlsList="nodownload">
            <source src="${post.videoUrl}" type="video/mp4">
          </video>
        </div>

        <a href="${post.videoUrl}" target="_blank" class="btn-grad">Download</a>
        <a href="${backLink}" class="btn-grad">Back</a>
      </div>
    </div>
  `;
})();
</script>

</body>
</html>
