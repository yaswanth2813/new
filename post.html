<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Details</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
  background:#0f1115;
  color:#fff;
  font-family:system-ui,-apple-system,BlinkMacSystemFont;
}

.container { margin-top:30px; }

/* ===== AMBIENCE ===== */
.ambience-wrapper {
  position:relative;
  overflow:hidden;
  border-radius:18px;
}

.ambience-bg {
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center;
  filter:blur(18px) brightness(.55);
  transform:scale(1.15);
  z-index:0;
}

.vignette {
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:2;
  background:radial-gradient(ellipse at center,
    rgba(0,0,0,0) 40%,
    rgba(0,0,0,.65) 100%);
}

.ambience-content {
  position:relative;
  z-index:3;
  padding:24px;
  text-align:center;
}

/* ===== POSTER ===== */
.poster-img {
  width:100%;
  max-width:360px;
  border-radius:12px;
  margin-bottom:20px;
}

/* ===== INFO BOX ===== */
.info-box {
  background:linear-gradient(to right,#3f4c6b,#606c88);
  border-radius:12px;
  padding:16px;
  margin-bottom:16px;
  color:#e3e7ef;
}

/* ===== VIDEO ===== */
.video-container { max-width:900px; margin:20px auto; }
video { width:100%; border-radius:12px; }

/* ===== BUTTON ===== */
.btn-grad {
  background-image:linear-gradient(to right,#757F9A 0%,#D7DDE8 51%,#757F9A 100%);
  padding:14px 40px;
  margin:10px;
  background-size:200% auto;
  transition:.5s;
  border-radius:10px;
  color:#fff;
  text-decoration:none;
  display:inline-block;
}
.btn-grad:hover { background-position:right center; }

/* ===== CAST ===== */
.cast-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
  gap:14px;
  margin-top:20px;
}

.cast-card {
  font-size:13px;
  text-align:center;
}

.cast-card img {
  width:100%;
  height:160px;
  object-fit:cover;
  border-radius:10px;
  margin-bottom:6px;
  background:#222;
}

/* ===== SKELETON ===== */
.skeleton {
  background:linear-gradient(
    90deg,
    #222 25%,
    #333 37%,
    #222 63%
  );
  background-size:400% 100%;
  animation:shimmer 1.4s ease infinite;
  border-radius:10px;
}

@keyframes shimmer {
  0% { background-position:100% 0; }
  100% { background-position:-100% 0; }
}

.sk-title { height:28px; width:60%; margin:0 auto 16px; }
.sk-poster { height:420px; max-width:360px; margin:0 auto 20px; }
.sk-text { height:14px; margin-bottom:10px; }
.sk-video { height:260px; border-radius:12px; margin:20px auto; }
.sk-cast { height:160px; }

footer {
  text-align:center;
  color:#777;
  margin:30px 0;
  font-size:14px;
}
</style>
</head>

<body>

<main class="container">
  <div id="movie-container"></div>
</main>

<footer>Data provided by YASH</footer>

<script>
/* ================= CONFIG ================= */
const TMDB_API_KEY = "532a88c1ce983a87d6b28e49ad40a68e";
const TMDB_BASE = "https://api.themoviedb.org/3";
const TMDB_IMG = "https://image.tmdb.org/t/p/";
const params = new URLSearchParams(location.search);
const id = parseInt(params.get("id"));
const src = params.get("src");
const POSTS_JSON_URL = src ? `${src}/${src}.json` : "posts.json";

/* ================= SKELETON UI ================= */
const container = document.getElementById("movie-container");
container.innerHTML = `
  <div class="ambience-wrapper">
    <div class="ambience-content">
      <div class="skeleton sk-title"></div>
      <div class="skeleton sk-poster"></div>

      <div class="info-box">
        <div class="skeleton sk-text"></div>
        <div class="skeleton sk-text"></div>
      </div>

      <div class="info-box">
        <div class="skeleton sk-text"></div>
        <div class="skeleton sk-text"></div>
        <div class="skeleton sk-text"></div>
      </div>

      <div class="cast-grid">
        ${Array(6).fill(0).map(()=>`<div class="skeleton sk-cast"></div>`).join("")}
      </div>

      <div class="skeleton sk-video"></div>
    </div>
  </div>
`;

/* ================= FETCH ================= */
async function fetchPosts() {
  const res = await fetch(POSTS_JSON_URL);
  return (await res.json()).filter(p => p.heading);
}

async function fetchTMDBMovie(title, year) {
  const url = `${TMDB_BASE}/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(title)}&year=${year}`;
  const res = await fetch(url);
  const data = await res.json();
  return data.results?.[0];
}

async function fetchCredits(id) {
  const res = await fetch(`${TMDB_BASE}/movie/${id}/credits?api_key=${TMDB_API_KEY}`);
  return await res.json();
}

/* ================= INIT ================= */
(async function init(){
  const posts = await fetchPosts();
  const post = posts.find(p => +p.id === id);
  if(!post){ container.innerHTML="Movie not found"; return; }

  let backdrop = post.poster;
  let plot = "No plot available";
  let rating = "N/A";
  let director = post.director || "N/A";
  let castHTML = "";

  const movie = await fetchTMDBMovie(post.heading, post.year);
  if(movie){
    backdrop = movie.backdrop_path ? TMDB_IMG+"w1280"+movie.backdrop_path : backdrop;
    plot = movie.overview || plot;
    rating = movie.vote_average || rating;

    const credits = await fetchCredits(movie.id);
    const dir = credits.crew.find(c=>c.job==="Director");
    if(dir) director = dir.name;

    castHTML = credits.cast.slice(0,12).map(c=>`
      <div class="cast-card">
        <img src="${c.profile_path ? TMDB_IMG+'w185'+c.profile_path : ''}">
        <span>${c.name}</span>
      </div>
    `).join("");
  }

  container.innerHTML = `
    <div class="ambience-wrapper fade-in">
      <div class="ambience-bg" style="background-image:url('${backdrop}')"></div>
      <div class="vignette"></div>

      <div class="ambience-content">
        <h2>${post.heading} (${post.year})</h2>
        <p class="text-muted">⭐ ${rating}</p>

        <img src="${post.poster}" class="poster-img">

        <div class="info-box">
          <p><strong>Director:</strong> ${director}</p>
          <p><strong>Cast:</strong> ${post.starring}</p>
        </div>

        <div class="info-box"><strong>Plot:</strong> ${plot}</div>

        ${castHTML ? `<h4 class="mt-4">Cast & Crew</h4><div class="cast-grid">${castHTML}</div>` : ""}

        <div class="video-container">
          <video controls>
            <source src="${post.videoUrl}" type="video/mp4">
          </video>
        </div>

        <a href="${post.videoUrl}" class="btn-grad" target="_blank">Download</a>
        <a href="${src ? src+'/index.html' : 'index.html'}" class="btn-grad">Back</a>
      </div>
    </div>
  `;
})();
</script>

</body>
</html>
